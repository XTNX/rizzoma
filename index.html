  $('#admSheet').innerHTML = `
    <div class="sheet__grab" aria-hidden="true"></div>
    <button class="sheet__close" data-close aria-label="Закрыть">✕</button>
    <h3 id="admTitle" style="font-size:24px">БЕТА / QA</h3>
    <div class="adm">
      <div class="adm__warn">Скрыто от тестеров · ${betaAdmin
        ? 'доступ подтверждён бэкендом: правки тумана видят все'
        : 'локальный режим: правки видит только этот браузер'}</div>

      <section>
        <h4>Туман · что открыто в бете</h4>
        <div class="adm__fog">${fogGrid}</div>
        <div class="mono muted" style="margin-top:8px">Открыто: ${betaOpenList().length} из ${TIERS.length}</div>
      </section>

      <section>
        <h4>Тестеры · воронка</h4>
        ${betaLive}
      </section>

      <section>
        <h4>Платежи теста</h4>
        <div class="adm__log">${payRows}</div>
      </section>

      <section>
        <h4>Состояние узла</h4>
        <div class="mono muted" style="margin-bottom:8px">
          me: ${u?esc(u.code):'—'} · refs: ${c} · ${tierName(c)} · скиллов: ${claimedCount()}/${TIERS.length}<br>
          attr: ${(readAttr()||{}).code || '—'} · users: ${Object.keys(DB.users).length} · buyers: ${Object.keys(DB.buyers).length}<br>
          tg: ${TG.on ? esc(WA.platform)+' v'+esc(WA.version) : 'вне telegram'} · cloud: ${TG.cloud()?'да':'нет'} ·
          crew: ${crewRemote ? 'бэкенд ('+crewRemote.length+')' : (CFG.crewDemo?'демо':'выкл')}
        </div>
        <div class="field" style="margin-top:0">
          <input id="admRefs" type="number" min="0" max="999" value="${c}" aria-label="Число рефералов">
          <button class="btn" data-adm="setrefs">Выставить</button>
        </div>
        <div class="adm__row" style="margin-top:6px">
          <button class="btn btn--ghost" data-adm="+1">+1 реферал</button>
          <button class="btn btn--ghost" data-adm="+5">+5</button>
          <button class="btn btn--ghost" data-adm="link">Тест-ссылка</button>
          <button class="btn btn--ghost" data-adm="forget">Сбросить атрибуцию</button>
        </div>
        <div class="field">
          <input id="admCode" placeholder="код чужого узла" maxlength="8" aria-label="Код узла">
          <button class="btn btn--ghost" data-adm="login">Войти</button>
        </div>
      </section>

      <section>
        <h4>Скиллы · превью анимаций без побочных эффектов</h4>
        <div class="adm__grid">
          ${TIERS.map((t,i) => {
            const st = nodeState(i);
            const stLabel = st===2 ? 'получен' : st===1 ? 'доступен' : st===-1 ? 'туман' : 'заблок.';
            return `<div class="adm__skill">
              <div class="h"><b>${esc(t.skill)}</b><span>${t.n} узл · ${stLabel}</span></div>
              <div class="r">
                <button data-adm="pv-open" data-i="${i}">open</button>
                <button data-adm="pv-claim" data-i="${i}">claim</button>
                <button data-adm="unlock" data-i="${i}">выдать</button>
                <button data-adm="clear" data-i="${i}">сброс</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </section>

      <section>
        <h4>Переключатели</h4>
        <button class="sw" data-adm="allunlock" aria-pressed="${ADMIN.allUnlocked}">Все скиллы разлочены <i></i></button>
        <button class="sw" data-adm="reduce" aria-pressed="${reduceMotion}" style="margin-top:6px">Reduce motion <i></i></button>
      </section>

      <section>
        <h4>Сырые данные · экспорт и импорт</h4>
        <textarea id="admRaw" spellcheck="false" aria-label="Состояние хранилища">${esc(rawState())}</textarea>
        <div class="adm__row" style="margin-top:6px">
          <button class="btn btn--ghost" data-adm="copyraw">Копировать</button>
          <button class="btn btn--ghost" data-adm="applyraw">Применить JSON</button>
          <button class="btn btn--ghost" data-adm="exportlog">Выгрузить лог</button>
          <button class="btn btn--ghost" data-adm="reset">Сбросить всё</button>
        </div>
      </section>

      <section>
        <h4>Журнал событий</h4>
        <div class="adm__log" id="admLog">${LOG.length ? LOG.map(l =>
          `${new Date(l.ts).toLocaleTimeString('ru-RU')} · <i>${esc(l.code)}</i> · ${
            l.kind==='claimed' ? '<b>claimed</b>' : esc(l.kind)} · ${esc(l.detail)}`).join('<br>')
          : 'пусто'}</div>
      </section>
    </div>`;
}
$('#admSheet').addEventListener('click', e => {
  const b = e.target.closest('[data-adm]'); if(!b) return;
  const act = b.dataset.adm, i = +b.dataset.i;
  const ensureMe = () => { let code = me(); if(!code){ code = newCode(); ensureUser(code,{}); setMe(code); } return code; };

  /* ---------- управление бетой ---------- */
  if(act === 'fog'){ betaToggle(i); return; }
  if(act === 'betasync'){ betaSync(); return; }
  if(act === 'revoke' || act === 'allow'){
    betaApi('/api/admin/tester', {id: b.dataset.id, action: act}).then(j => {
      if(!j || j.denied){ toast('Сервер не принял', true); return; }
      toast(act === 'revoke' ? 'Тестер отозван' : 'Тестер возвращён');
      betaSync();
    });
    return;
  }
  if(act === 'exportlog'){
    copy(JSON.stringify({
      betaOpen: betaOpenList(),
      log: LOG,
      testers: (betaData && betaData.testers) || null,
      payments: (betaData && betaData.payments) || null,
      state: JSON.parse(rawState())
    }, null, 2), 'Лог скопирован');
    return;
  }

  if(act === 'setrefs' || act === '+1' || act === '+5'){
    const code = ensureMe(), u = ensureUser(code, {});
    if(act === 'setrefs'){
      const want = clamp(parseInt($('#admRefs').value, 10) || 0, 0, 999);
      u.referrals = Array.from({length:want}, (_,k) => 'qa' + k + '@rizzoma.test');
    } else {
      const n = act === '+1' ? 1 : 5;
      for(let k=0;k<n;k++) u.referrals.push('qa' + Date.now() + k + '@rizzoma.test');
    }
    saveDB(); renderAll(); renderAdmin(); toast('QA: узлов ' + refCount(u));
  }
  if(act === 'link'){ const c = newCode(); ensureUser(c,{}); saveDB(); copy(refLink(c), 'QA: тест-ссылка ' + c); }
  if(act === 'forget'){ ls.del(K_ATTR); renderAll(); renderAdmin(); toast('QA: атрибуция сброшена'); }
  if(act === 'login'){
    const v = ($('#admCode').value || '').trim().toUpperCase();
    if(v.length < 4) return toast('QA: введи код', true);
    ensureUser(v,{}); saveDB(); setMe(v); lastTier = -99; renderAll(); renderAdmin(); toast('QA: узел ' + v);
  }
  /* превью не трогают реальное состояние claim */
  if(act === 'pv-open'){ closeHost('#admHost'); setTab('tree'); setTimeout(()=>openNode(i, true), 120); }
  if(act === 'pv-claim'){
    closeHost('#admHost'); setTab('tree');
    setTimeout(() => { const n = nodeByTier(i); if(n) centerOn(n, 1.3); playClaimFX(i, true); TG.haptic('notify','success'); toast('PREVIEW: ' + TIERS[i].skill); }, 140);
  }
  if(act === 'unlock'){
    ensureMe();
    const list = claims();
    if(list.indexOf(i) < 0){ list.push(i); list.sort((a,b)=>a-b); saveClaims(); logEvent('claimed·qa', TIERS[i].skill); }
    renderAll(); renderAdmin();
  }
  if(act === 'clear'){
    const list = claims(), k = list.indexOf(i);
    if(k >= 0){ list.splice(k,1); saveClaims(); logEvent('cleared·qa', TIERS[i].skill); }
    renderAll(); renderAdmin();
  }
  if(act === 'allunlock'){ ADMIN.allUnlocked = !ADMIN.allUnlocked; renderAll(); renderAdmin(); }
  if(act === 'reduce'){
    reduceMotion = !reduceMotion; applyReduce();
    if(reduceMotion){ stopLoop(); energy = energyTarget; kick(); } else startLoop();
    renderAdmin();
  }
  if(act === 'copyraw') copy($('#admRaw').value, 'QA: состояние скопировано');
  if(act === 'applyraw'){
    try {
      const d = JSON.parse($('#admRaw').value);
      if(d[K_DB]) ls.set(K_DB, JSON.stringify(d[K_DB]));
      if(d[K_ME]) ls.set(K_ME, String(d[K_ME]));
      if(d[K_ATTR]) ls.set(K_ATTR, JSON.stringify(d[K_ATTR]));
      if(d[K_CLAIMS]) ls.set(K_CLAIMS, JSON.stringify(d[K_CLAIMS]));
      DB = loadDB(); adoptCloudClaims(); lastTier = -99;
      renderAll(); renderAdmin(); toast('QA: состояние применено');
    } catch(err){ toast('QA: невалидный JSON', true); }
  }
  if(act === 'reset'){
    [K_DB, K_ME, K_ATTR, K_CLAIMS].forEach(k => ls.del(k));
    location.href = location.pathname + (admOn ? '?admin=1' : '');
  }
});
/* ============================================================
   20. СТАРТ
   ============================================================ */
adoptCloudClaims();
lastTier = tierIndex(refCount(myUser()));
resize();
renderAll();
energy = energyTarget;
setTab('tree');
if(admOn) openAdmin();

/* Хук для автотестов: узлы живут на канве, у них нет DOM-элементов, поэтому
   e2e нужно откуда-то брать их координаты и состояние. Включается только
   явным ?e2e=1 — в обычном запуске этого объекта не существует. */
if(QS.get('e2e') === '1'){
  window.__RZ = {
    node: i => { const n = nodeByTier(i); return n ? {x:n.sx, y:n.sy, st:nodeState(i)} : null; },
    beta: () => betaOpenList(),
    bounds: () => camBounds(),
    fogAhead: (axis, dir) => fogAhead(axis, dir),
    refs: () => refCount(myUser()),
    claims: () => claims().slice(),
    boot: () => BOOT.phase
  };
}

addEventListener('resize', () => { resize(); }, {passive:true});
new ResizeObserver(() => resize()).observe($('#stage'));
document.addEventListener('visibilitychange', () => {
  document.hidden ? stopLoop() : (S.tab === 'tree' && startLoop());
});

/* Telegram: прогресс из CloudStorage (новое устройство — тот же узел)
   и «Свои» из бэкенда бота, если он прописан в config.js. */
cloudPull(() => {
  DB = loadDB();
  adoptCloudClaims();
  lastTier = tierIndex(refCount(myUser()));
  renderAll();
  toast('Узел восстановлен из Telegram');
});
if(TG.on && API){
  const a = readAttr();
  fetch(API + '/api/visit', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({initData: WA.initData, ref: a ? a.code : ''})
  }).catch(()=>{})
    .then(() => stateFetch())
    .then(s => { if(s) applyServerState(s); return crewFetch(); })
    .then(list => { if(list){ crewRemote = list; renderCrew(); } return engagementFetch(); })
    .then(eng => { if(eng){ saveEng(eng); renderCrew(); } })
    .catch(()=>{});
}
})();
</script>
</body>
</html>
