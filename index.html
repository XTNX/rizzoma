<script>
/* ============================================================
   RIZZOMA — Telegram Mini App «дерево узлов»
   ⚠ ДЕМО: «БД» рефералов и «платежи» живут в localStorage.
   Для продакшна — сервер + платёжный провайдер; атрибуция,
   анти-фрод и выдача скиллов считаются на бэкенде.
   ============================================================ */
(() => {
'use strict';
/* ============================================================
   0. TELEGRAM MINI APP — мост
   Основной сценарий использования — приложение внутри Telegram,
   но браузерный fallback обязателен: без хаптики и системных
   кнопок всё то же самое работает мышью/пальцем.
   Всё через isVersionAtLeast — на старых клиентах молча деградирует.
   ============================================================ */
const CFG = Object.assign({bot:'', app:'', apiBase:'', crewDemo:true, qaButton:false,
                           prices:{std:null, vip:null}, event:{}, betaOpen:null, admins:[],
                           panel:true},
                          window.RIZZOMA_CONFIG || {});
const API = CFG.apiBase ? CFG.apiBase.replace(/\/+$/,'') : '';
const WA  = (window.Telegram && window.Telegram.WebApp) || null;
const inTG = !!(WA && WA.initData !== undefined && WA.platform && WA.platform !== 'unknown');

const TG = {
  on: inTG,
  user: (inTG && WA.initDataUnsafe && WA.initDataUnsafe.user) || null,
  v(x){ try { return inTG && WA.isVersionAtLeast && WA.isVersionAtLeast(x); } catch(e){ return false; } },
  startParam(){ try { return (inTG && WA.initDataUnsafe && WA.initDataUnsafe.start_param) || ''; } catch(e){ return ''; } },

  haptic(kind, arg){
    if(!TG.v('6.1') || !WA.HapticFeedback) return;
    try {
      if(kind === 'notify') WA.HapticFeedback.notificationOccurred(arg || 'success');
      else if(kind === 'select') WA.HapticFeedback.selectionChanged();
      else WA.HapticFeedback.impactOccurred(arg || 'light');
    } catch(e){}
  },

  /* системная кнопка действия — контекстная: активация скилла / оплата */
  _mainCb: null,
  mainShow(text, cb, color){
    if(!inTG || !WA.MainButton) return false;
    try {
      if(TG._mainCb) WA.MainButton.offClick(TG._mainCb);
      TG._mainCb = cb; WA.MainButton.onClick(cb);
      if(TG.v('6.1')) WA.MainButton.setParams({text, color: color || '#B6FF3C', text_color:'#08080A'});
      else WA.MainButton.setText(text);
      WA.MainButton.enable(); WA.MainButton.show();
      return true;
    } catch(e){ return false; }
  },
  mainProgress(on){
    if(!inTG || !WA.MainButton) return;
    try { on ? (WA.MainButton.showProgress(true), WA.MainButton.disable())
             : (WA.MainButton.hideProgress(), WA.MainButton.enable()); } catch(e){}
  },
  mainHide(){
    if(!inTG || !WA.MainButton) return;
    try {
      WA.MainButton.hideProgress(); WA.MainButton.hide();
      if(TG._mainCb){ WA.MainButton.offClick(TG._mainCb); TG._mainCb = null; }
    } catch(e){}
  },

  /* системная «назад» обслуживает стек модалок, а не выход из приложения */
  _backCb: null, backOK:false,
  back(show, cb){
    if(!inTG || !WA.BackButton) return;
    try {
      if(TG._backCb){ WA.BackButton.offClick(TG._backCb); TG._backCb = null; }
      if(show){ TG._backCb = cb; WA.BackButton.onClick(cb); WA.BackButton.show(); TG.backOK = true; }
      else WA.BackButton.hide();
      document.documentElement.classList.toggle('no-back', !TG.backOK);
    } catch(e){}
  },

  share(url, text){
    if(!inTG) return false;
    try {
      WA.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) +
                          '&text=' + encodeURIComponent(text || ''));
      return true;
    } catch(e){ return false; }
  },

  /* CloudStorage: зеркало localStorage, привязанное к аккаунту Telegram */
  cloud(){ return (TG.v('6.9') && WA.CloudStorage) ? WA.CloudStorage : null; }
};

if(inTG){
  document.documentElement.classList.add('tg','no-back');
  try {
    WA.ready(); WA.expand();
    if(TG.v('8.0') && WA.requestFullscreen){ try { WA.requestFullscreen(); } catch(e){} }
    if(TG.v('6.1')){ WA.setHeaderColor('#08080A'); WA.setBackgroundColor('#08080A'); }
    if(TG.v('6.2') && WA.enableClosingConfirmation) WA.enableClosingConfirmation();
    // без этого вертикальный драг по канве сворачивает приложение
    if(TG.v('7.7') && WA.disableVerticalSwipes) WA.disableVerticalSwipes();

    const syncViewport = () => {
      const root = document.documentElement.style;
      root.setProperty('--tg-vh', (WA.viewportStableHeight || innerHeight) + 'px');
      const safe = WA.safeAreaInset || {}, content = WA.contentSafeAreaInset || {};
      root.setProperty('--tg-top', ((safe.top || 0) + (content.top || 0)) + 'px');
      root.setProperty('--tg-bottom', ((safe.bottom || 0) + (content.bottom || 0)) + 'px');
    };
    syncViewport();
    ['viewportChanged','safeAreaChanged','contentSafeAreaChanged','fullscreenChanged']
      .forEach(ev => { try { WA.onEvent(ev, syncViewport); } catch(e){} });
  } catch(e){}
}

/* ---------- 1. окружение ---------- */
const QS = new URLSearchParams(location.search);
let reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches || QS.get('reduce') === '1';
const isCoarse = matchMedia('(pointer: coarse)').matches;
const applyReduce = () => document.documentElement.classList.toggle('reduce', reduceMotion);
applyReduce();

/* ---------- 2. store (mock db) ----------
   Схема ключей — защищённый контракт (brand-spec.md#6), расширяется
   только аддитивно: в DB добавлено поле claims, рядом появился
   компактный ключ rizzoma_claims (он влезает в лимит CloudStorage
   даже когда полный дамп БД уже не влезает).                       */
const K_DB='rizzoma_mock_db', K_ME='rizzoma_me', K_ATTR='rizzoma_attribution', K_CLAIMS='rizzoma_claims';
const ATTR_TTL = 30*24*60*60*1000;
const CLOUD_KEYS = [K_DB, K_ME, K_ATTR, K_CLAIMS];
/* Баллы за канал — демо-уровень и хранятся локально: ключ намеренно НЕ в
   CLOUD_KEYS, как и rizzoma_beta. Считает их всё равно бэкенд, здесь только
   кэш последнего ответа, чтобы показать сумму до и без сети. */
const K_ENG = 'rizzoma_engagement';

const cloudPush = (k, v) => {
  const c = TG.cloud();
  if(!c || CLOUD_KEYS.indexOf(k) < 0) return;
  try { (v === null) ? c.removeItem(k, ()=>{}) : (String(v).length <= 4000 && c.setItem(k, String(v), ()=>{})); } catch(e){}
};
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} cloudPush(k, v); },
  del(k){ try { localStorage.removeItem(k); } catch(e){} cloudPush(k, null); }
};
function cloudPull(done){
  const c = TG.cloud();
  if(!c) return;
  try {
    c.getItems(CLOUD_KEYS, (err, data) => {
      if(err || !data) return;
      let adopted = false;
      CLOUD_KEYS.forEach(k => {
        if(data[k] && !ls.get(k)){ try { localStorage.setItem(k, data[k]); adopted = true; } catch(e){} }
      });
      if(adopted) done && done();
      else CLOUD_KEYS.forEach(k => { const v = ls.get(k); if(v) cloudPush(k, v); });
    });
  } catch(e){}
}

function loadDB(){
  const raw = ls.get(K_DB);
  if(raw){ try {
    const d = JSON.parse(raw);
    if(d && d.users) return {users:d.users||{}, buyers:d.buyers||{}, profiles:d.profiles||{}, claims:d.claims||{}};
  } catch(e){} }
  return {users:{}, buyers:{}, profiles:{}, claims:{}};
}
let DB = loadDB();
const saveDB = () => ls.set(K_DB, JSON.stringify(DB));

const ALPHA='ACDEFHJKLMNPRTUVWXY3479';
function newCode(){
  let c;
  do { c=''; for(let i=0;i<6;i++) c+=ALPHA[Math.floor(Math.random()*ALPHA.length)]; }
  while(DB.users[c]);
  return c;
}
function ensureUser(code, patch){
  if(!DB.users[code]) DB.users[code] = {code, name:'', email:'', paid:false, referredBy:null, referrals:[], ts:Date.now()};
  if(patch) Object.assign(DB.users[code], patch);
  return DB.users[code];
}
const me = () => { const c = ls.get(K_ME); return c && DB.users[c] ? c : null; };
const setMe = c => ls.set(K_ME, c);
const myUser = () => { const c = me(); return c ? DB.users[c] : null; };
const refCount = u => (u && u.referrals ? u.referrals.length : 0);

/* claims — какие скиллы уже получены текущим узлом */
function claims(){
  const c = me(); if(!c) return [];
  if(!DB.claims) DB.claims = {};
  return DB.claims[c] || (DB.claims[c] = []);
}
const hasClaim = i => claims().indexOf(i) >= 0;
function saveClaims(){
  const c = me(); if(!c) return;
  saveDB();
  ls.set(K_CLAIMS, JSON.stringify({code:c, list:claims()}));
}
/* компактное облачное зеркало могло приехать с другого устройства раньше БД */
function adoptCloudClaims(){
  const raw = ls.get(K_CLAIMS), c = me();
  if(!raw || !c) return;
  try {
    const d = JSON.parse(raw);
    if(d && d.code === c && Array.isArray(d.list)){
      if(!DB.claims) DB.claims = {};
      const cur = DB.claims[c] || [];
      const merged = [...new Set(cur.concat(d.list))].filter(i => i >= 0 && i < 10).sort((a,b)=>a-b);
      if(merged.length !== cur.length){ DB.claims[c] = merged; saveDB(); }
    }
  } catch(e){}
}

/* ---------- 3. атрибуция ---------- */
function readAttr(){
  const raw = ls.get(K_ATTR);
  if(!raw) return null;
  try {
    const a = JSON.parse(raw);
    if(!a || !a.code || !a.ts) return null;
    if(Date.now() - a.ts > ATTR_TTL){ ls.del(K_ATTR); return null; }
    return a;
  } catch(e){ return null; }
}
function captureRef(){
  const url = new URL(location.href);
  let code = url.searchParams.get('ref');
  // Telegram: t.me/<бот>/<апп>?startapp=КОД → initDataUnsafe.start_param
  if(!code) code = String(TG.startParam() || '').replace(/^ref[_-]?/i, '');
  if(!code){ const m = location.pathname.match(/\/r\/([A-Za-z0-9]{4,10})\/?$/); if(m) code = m[1]; }
  if(!code || !/^[A-Za-z0-9]{4,8}$/.test(code)) return;
  code = code.toUpperCase().slice(0,8);
  if(code === me()) return;                     // защита от самореферала
  ensureUser(code, {}); saveDB();
  ls.set(K_ATTR, JSON.stringify({code, ts:Date.now()}));
}
captureRef();

/* ============================================================
   4. ЭКОНОМИКА И БЕТА
   Числа, тарифы и расчёт цены живут в economy.js — тот же файл
   считает цену в юнит-тестах. Здесь только состояние беты:
   какие узлы открыты, а какие закрыты туманом.
   ============================================================ */
const ECON = window.RIZZOMA_ECONOMY;
const {TIERS, BRANCHES, TICKET_CLASS, TICKET_SIZE, VIP_TIER,
       classBase, sizeOf, tierIndex, tierName, branchOf,
       money, priceLabel, effPrice, comboPrice, priceNotes} = ECON;

const EVENT_LINE = (CFG.event && CFG.event.line) ||
  'Следующий ивент · дата не объявлена · Санкт-Петербург · 18+';

/* ---------- туман войны ----------
   Бета открывает только узлы про билеты (ветвь ВОЛЯ) и одну
   VIP-привилегию (ГЛУБИНА). Остальные узлы остаются на сцене, но
   закрыты туманом: это «вне беты», а не «не хватает рефералов» —
   в UI это два разных состояния и два разных текста.
   Набор правится админкой на лету и переживает перезагрузку. */
const K_BETA = 'rizzoma_beta';
let betaOpen = (() => {
  const raw = ls0(K_BETA);
  if(raw){ try { const a = JSON.parse(raw); if(Array.isArray(a)) return new Set(a.map(Number)); } catch(e){} }
  const base = Array.isArray(CFG.betaOpen) ? CFG.betaOpen : ECON.BETA_OPEN;
  return new Set(base.map(Number));
})();
function ls0(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
const inBeta  = i => betaOpen.has(i);
const fogged  = i => !inBeta(i);
function setBetaOpen(list){
  betaOpen = new Set(list.map(Number));
  try { localStorage.setItem(K_BETA, JSON.stringify([...betaOpen].sort((a,b)=>a-b))); } catch(e){}
}
const betaOpenList = () => [...betaOpen].sort((a,b)=>a-b);
/* цены приходят из config.js: null → «уточняется», оплата заблокирована */
const priceOpts = () => ({prices: CFG.prices || {}, vipSkill: hasClaim(VIP_TIER)});
const classPrice = id => classBase(id, CFG.prices || {});

/* ---------- 5. утилиты ---------- */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
function mulberry32(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

let toastTimer;
function toast(msg, warn){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('warn', !!warn);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* журнал QA-событий: открытия и активации, чтобы глазами проверять анти-дубль */
const LOG = [];
function logEvent(kind, detail){
  LOG.unshift({kind, detail, code: me() || '—', ts: Date.now()});
  if(LOG.length > 60) LOG.pop();
  if($('#admLog') && !$('#admHost').hidden) renderAdmin();
}

/* детерминированный сигил: seed = хеш строки. Один генератор на аватар узла,
   иконку скилла в окне и знак на канве — источник формы один. */
function sigilPath(seed){
  const rnd = mulberry32(hashStr(String(seed)));
  const arms = 3 + Math.floor(rnd()*3);
  let d = '';
  for(let a=0;a<arms;a++){
    let x = 50, y = 92 - a*6;
    const seg = 3 + Math.floor(rnd()*3);
    let path = `M ${x} ${y}`;
    for(let s=0;s<seg;s++){
      const dx = (10 + rnd()*22) * (rnd()<0.5?-1:1);
      const dy = -(12 + rnd()*20);
      x += dx*0.5; y += dy*0.6;
      path += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
      x += dx*0.5;
      path += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    d += path + ' ';
  }
  return d.trim();
}
function sigilSVG(seed, color){
  const d = sigilPath(seed);
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="${color || 'var(--ink)'}" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="${d}"/><g transform="translate(100,0) scale(-1,1)"><path d="${d}"/></g>
    </g></svg>`;
}
/* ============================================================
   6. ГЕНЕРАТИВНАЯ СЕТЬ — движок сохранён без изменений
   Один «клин» строится рекурсивным ветвлением с ломаными
   сегментами, затем зеркалится и вращается 2×S раз вокруг
   логотипа. Path2D на группу глубины → кадр стоит ~70 stroke.
   В приложении этот слой ушёл на задний план: он рисует мандалу
   вокруг ядра, а поверх на той же геометрии живёт дерево узлов.
   ============================================================ */
function buildWedge(seed, opts){
  const rnd = mulberry32(seed);
  const {depth, spread, decay, kink} = opts;
  const groups = Array.from({length:depth+1}, () => ({seg:new Path2D(), dots:new Path2D(), pts:[]}));
  const paths = [];
  /* polys — те же звенья, но точками: по ним рисуется «прожиг» ветви
     и летят частицы. Аддитивно к прежнему выводу, геометрия не меняется. */
  const polys = [];

  function branch(x,y,ang,len,d,trail,segs){
    if(d>depth) return;
    // ломаный сегмент: середина смещена в сторону — трайбл-ритм вместо прямой
    const mx = x + Math.cos(ang)*len*0.55 + Math.cos(ang+Math.PI/2)*len*kink*(rnd()<0.5?-1:1);
    const my = y + Math.sin(ang)*len*0.55 + Math.sin(ang+Math.PI/2)*len*kink*(rnd()<0.5?-1:1);
    const ex = x + Math.cos(ang)*len, ey = y + Math.sin(ang)*len;
    const g = groups[d];
    g.seg.moveTo(x,y); g.seg.lineTo(mx,my); g.seg.lineTo(ex,ey);
    const r = (0.006 + (depth-d)*0.0016) * (opts.dot || 1);
    g.dots.moveTo(ex+r,ey); g.dots.arc(ex,ey,r,0,Math.PI*2);
    g.pts.push([ex,ey]);
    const t2 = trail.concat([[ex,ey]]);
    const s2 = segs.concat([[[x,y],[mx,my],[ex,ey]]]);
    if(d===depth){ paths.push(t2); polys.push(s2); return; }
    const kids = rnd()<0.22 ? 3 : 2;
    for(let i=0;i<kids;i++){
      const off = (i - (kids-1)/2) * spread * (0.75 + rnd()*0.5);
      branch(ex, ey, ang+off, len*decay*(0.85+rnd()*0.3), d+1, t2, s2);
    }
  }
  branch(0,0,-Math.PI/2,0.30,0,[[0,0]],[]);
  return {groups, paths, polys};
}

/* Контур логотипа = ядро дерева. Источник тот же, что и в вёрстке
   (<symbol id="rz-logo">): заменишь логотип — поменяется и сцена. */
const LOGO_VB = 499;
const LOGO_PATH = (() => {
  const el = document.getElementById('logoPath');
  try { return el ? new Path2D(el.getAttribute('d')) : null; } catch(e){ return null; }
})();

/* ============================================================
   7. УЗЛЫ ПРОКАЧКИ = ВЕРШИНЫ САМОЙ СЕТИ
   Скиллы не лежат поверх сцены отдельным слоем: каждый садится на
   реальную вершину клина buildWedge. Клин зеркалится и вращается
   2×S раз вокруг логотипа; при S=3 получаются три луча (m=0) —
   они и несут ветви прокачки, зеркальные двойники остаются
   декоративным облаком. Глубина ветвления = кольцо прокачки.
   ============================================================ */
const MAND_S = 3;                                   // три ветви → тройная симметрия
/* глубина фиксированная: геометрия не должна зависеть от устройства,
   иначе дерево на телефоне и на десктопе — разное */
/* decay ближе к единице: звенья к периферии почти не укорачиваются,
   поэтому кольца прокачки ложатся равномерно, а не слипаются снаружи */
/* глубина 6, а не 7: седьмое кольцо удваивало геометрию кадра, а плотность
   картинки всё равно держит кэшированное облако точек */
const MANDALA = buildWedge(480921, {depth:6, spread:0.44, decay:0.86, kink:0.14, dot:1.9});

/* Спина ветви — самая длинная корневая трасса клина: она уходит от ядра
   дальше всех, поэтому кольца прокачки на ней расходятся, а не слипаются
   у периферии. На её вершинах и сидят скиллы. */
const SPINE = (() => {
  let best = 0, bd = -1;
  MANDALA.paths.forEach((p, i) => {
    const e = p[p.length-1], d = Math.hypot(e[0], e[1]);
    if(d > bd){ bd = d; best = i; }
  });
  return {pts: MANDALA.paths[best], polys: MANDALA.polys[best]};
})();
const SPINE_R = SPINE.pts.map(p => Math.hypot(p[0], p[1]));

/* SKILLS[i] = {i, b, k, wx, wy, polys} — wx/wy это координаты вершины
   сети в системе клина; экранная позиция считается тем же поворотом,
   что и у луча, поэтому узел физически привязан к сети. */
const SKILLS = [];
BRANCHES.forEach((br, b) => {
  const last = SPINE.pts.length - 1;
  // кольца выбираются по РАДИУСУ, а не по номеру: к периферии звенья сети
  // укорачиваются, и равномерный шаг по индексу слепил бы дальние узлы.
  // Первое кольцо пропускаем — там узел налезал бы на знак.
  // два внешних кольца сети остаются без узлов: облако сети должно уходить
  // за пределы дерева, а не заканчиваться на последнем скилле
  const outer = last - 2;
  const n = br.idx.length, r0 = SPINE_R[2], r1 = SPINE_R[outer];
  let cursor = 1;
  const idxs = br.idx.map((_, k) => {
    const target = r0 + (r1 - r0)*k/(n - 1);
    let bi = Math.max(2, cursor + 1), bd = Infinity;
    for(let j = Math.max(2, cursor + 1); j <= outer - (n - 1 - k); j++){
      const d = Math.abs(SPINE_R[j] - target);
      if(d < bd){ bd = d; bi = j; }
    }
    cursor = bi;
    return bi;
  });
  br.idx.forEach((ti, k) => {
    const idx  = idxs[k];
    const prev = k === 0 ? 0 : idxs[k-1];
    const p = SPINE.pts[idx];
    SKILLS.push({
      i: ti, b, k,
      wx: p[0], wy: p[1],
      polys: SPINE.polys.slice(prev, idx),          // звенья сети от прошлого узла к этому
      sx: null, sy: null
    });
  });
});
const nodeByTier = i => SKILLS.find(s => s.i === i);
/* габарит всех трёх лучей (с запасом под заголовки ветвей) — по нему сцена
   вписывается в экран и на телефоне, и на десктопе */
const SKILL_EXT = (() => {
  let h = 0.1, v = 0.1;
  SKILLS.forEach(s => {
    const a = s.b*(Math.PI*2/MAND_S), ca = Math.cos(a), sa = Math.sin(a);
    const r = Math.hypot(s.wx, s.wy), rr = (r + 0.10)/(r || 1);
    const x = (s.wx*ca - s.wy*sa)*rr, y = (s.wx*sa + s.wy*ca)*rr;
    h = Math.max(h, Math.abs(x)); v = Math.max(v, Math.abs(y));
  });
  return {h, v};
})();

/* состояние узла: -1 — вне беты (туман), 0 — заблокирован, 1 — доступен, 2 — получен.
   «Вне беты» проверяется первым: узел под туманом не активируется даже с
   переключателем «все скиллы разлочены» — иначе QA-режим ломал бы границу теста. */
function nodeState(i){
  if(fogged(i)) return hasClaim(i) ? 2 : -1;
  if(hasClaim(i)) return 2;
  if(ADMIN.allUnlocked) return 1;
  return refCount(myUser()) >= TIERS[i].n ? 1 : 0;
}
const claimedCount = () => TIERS.reduce((s,_,i) => s + (hasClaim(i)?1:0), 0);
const readyCount   = () => TIERS.reduce((s,_,i) => s + (nodeState(i)===1?1:0), 0);

/* ============================================================
   8. СЦЕНА — одна система координат на сеть и на узлы
   Мандала рисуется прежним трансформ-путём, а узлы проецируются
   тем же поворотом луча и тем же масштабом — поэтому они всегда
   стоят точно на вершинах сети, а не «поверх» неё.
   ============================================================ */
const cv = $('#tree');
const ctx = cv.getContext('2d', {alpha:true});

/* Камера: x/y/z — то, что видно сейчас, tx/ty/tz — куда едем. Разделение на
   «текущее» и «цель» даёт одним механизмом и плавный перелёт к узлу, и
   резиновый возврат из overscroll. */
const CAM = {x:0, y:0, z:1, tx:0, ty:0, tz:1, min:0.55, max:3.2};
let W=0, H=0, dpr=1, base=1, raf=0, running=false;
let rot = 0, rotDrift = 0, lastT = 0;   // общий поворот сети (её же наследуют узлы)
let shake = 0;                       // микро-тряска камеры при активации
const FX = [];                       // частицы вдоль ветви
let burn = null;                     // {i, start, dur, preview}
let hold = null;                     // {i, start, dur, source}
let energy = 0, energyTarget = 0;    // «прожиг» сети

/* фазы запуска: idle — только фиолетовый знак; unfurl — развёртка сети
   и импульс готовности; ready — рабочий режим */
const BOOT = {phase:'idle', t0:0, dur:2300};

/* ---------------------------------------------------------------
   Облако точек между ветвями: у каждой вершины сети свой рой
   спутников, разлетающихся в сторону соседнего луча. Чем дальше от
   ветви, тем мельче кружок — поэтому облака соседних лучей смыкаются
   в середине промежутка, а не обрываются. Строится один раз, рисуется
   тем же трансформом ×2S, что и сама сеть.
   --------------------------------------------------------------- */
const HALO = (() => {
  const rnd = mulberry32(90210);
  const span = Math.PI/MAND_S;                 // до середины промежутка между лучами
  const sizes = [0.0072, 0.0054, 0.0039, 0.0027, 0.0017];
  const buckets = sizes.map(s => ({s, path:new Path2D(), n:0}));
  const D = MANDALA.groups.length;
  for(let d=2; d<D; d++){
    const pts = MANDALA.groups[d].pts;
    const step = d < 4 ? 1 : 2;                // облако печётся один раз — можно плотно
    for(let i=0;i<pts.length;i+=step){
      const r = Math.hypot(pts[i][0], pts[i][1]);
      if(r < 0.12) continue;
      const a0 = Math.atan2(pts[i][1], pts[i][0]);
      const n = 3 + Math.floor(rnd()*3);
      for(let k=0;k<n;k++){
        const u  = rnd();                      // 0 — у самой ветви, 1 — середина промежутка
        const da = (rnd()<0.5?-1:1) * span * u;
        const rr = r * (0.90 + rnd()*0.24);
        const x = Math.cos(a0+da)*rr, y = Math.sin(a0+da)*rr;
        const fall = Math.pow(1-u, 1.6);       // размер падает с удалением от ветви
        const bi = clamp(Math.round((1-fall)*(sizes.length-1)), 0, sizes.length-1);
        const b = buckets[bi], rad = b.s;
        b.path.moveTo(x+rad, y); b.path.arc(x, y, rad, 0, Math.PI*2); b.n++;
      }
    }
  }
  return buckets;
})();

/* ---------------------------------------------------------------
   Облако точек печётся один раз в offscreen-канву: несколько тысяч
   дуг за кадр — самая дорогая часть сцены, а выглядит она одинаково
   при любом масштабе (кружок должен расти вместе со сценой). Сами
   ветви остаются путями: их штрих обязан держать 1.5 экранных px
   на любом зуме, а растр при уменьшении такие линии съедает.
   --------------------------------------------------------------- */
const NET_REF = 460, NET_MAXR = 1.15;
let NET = null;
function bakeNetwork(){
  const side = Math.ceil(2*NET_REF*NET_MAXR);
  const k = Math.min(dpr || 1, 1.5);
  const c = document.createElement('canvas');
  c.width = c.height = Math.round(side*k);
  const g = c.getContext('2d');
  g.setTransform(k,0,0,k,0,0);
  g.translate(side/2, side/2);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for(let a=0;a<MAND_S;a++){                       // облако точек — дальний план
    for(let m=0;m<2;m++){
      g.save();
      g.rotate(a*(Math.PI*2/MAND_S));
      g.scale(NET_REF*(m?-1:1), NET_REF);
      HALO.forEach((b, i) => {
        g.fillStyle = `oklch(0.62 0.20 300 / ${(0.26 - i*0.045).toFixed(3)})`;
        g.fill(b.path);
      });
      g.restore();
    }
  }
  NET = {cv:c, side};
}

const SIG_CACHE = new Map();
function sigilP2D(i){
  if(!SIG_CACHE.has(i)) SIG_CACHE.set(i, new Path2D(sigilPath('SKILL_' + TIERS[i].skill)));
  return SIG_CACHE.get(i);
}

function resize(){
  const r = cv.getBoundingClientRect();
  const prevDpr = dpr;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cvLeft = r.left; cvTop = r.top;                // для перевода HTML-оверлеев в координаты канвы
  if(!NET || dpr !== prevDpr) bakeNetwork();     // кэш зависит только от dpr
  // вписываем три луча целиком; облако сети при этом уходит за кадр — так и задумано
  fitScene();
  draw(performance.now());
}

/* Прогресс развёртки. Все кривые сходятся к своим финальным значениям
   с нулевой производной (ease-out cubic / smoothstep), поэтому переход
   «unfurl → ready» не даёт скачка ни в масштабе, ни в яркости. */
const easeOut = x => 1 - Math.pow(1 - x, 3);
const smooth  = x => x*x*(3 - 2*x);
const PH_READY = {grow:1, wave:-1, core:1, alpha:1, spin:0, p:1};
const PH_IDLE  = {grow:0, wave:-1, core:2.15, alpha:0, spin:-0.34, p:0};
function bootPhase(t){
  if(BOOT.phase === 'ready') return PH_READY;
  if(BOOT.phase === 'idle')  return PH_IDLE;
  const p = clamp((t - BOOT.t0)/BOOT.dur, 0, 1);
  return {
    p,
    grow:  easeOut(clamp(p/0.62, 0, 1)),
    // импульс готовности катится от ядра наружу во второй половине развёртки
    wave:  p < 0.34 ? -1 : ((p - 0.34)/0.66) * 1.45,
    core:  2.15 - 1.15*easeOut(clamp(p/0.55, 0, 1)),
    alpha: smooth(clamp((p - 0.52)/0.48, 0, 1)),
    spin: -0.34*(1 - easeOut(p))
  };
}

/* Стартовый доворот сети подбирается под экран: перебираем повороты внутри
   сектора симметрии и берём тот, при котором три луча вписываются крупнее
   всего. На вертикальном телефоне и на десктопе это разные углы. */
let rot0 = 0;
function fitScene(){
  let bestS = 0, bestR = 0;
  for(let i=0;i<48;i++){
    const r0 = i*(Math.PI*2/MAND_S)/48;
    let h = 0.05, v = 0.05;
    SKILLS.forEach(s => {
      const a = r0 + s.b*(Math.PI*2/MAND_S), ca = Math.cos(a), sa = Math.sin(a);
      const r = Math.hypot(s.wx, s.wy) || 1, k = (r + 0.10)/r;
      h = Math.max(h, Math.abs((s.wx*ca - s.wy*sa)*k));
      v = Math.max(v, Math.abs((s.wx*sa + s.wy*ca)*k));
    });
    const s = Math.min((W/2 - 26)/h, (H/2 - 26)/v);
    if(s > bestS){ bestS = s; bestR = r0; }
  }
  base = bestS; rot0 = bestR;
}
const armAngle = b => rot0 + rot + b*(Math.PI*2/MAND_S);
/* вершина клина → экран: тот же поворот и масштаб, что у самой сети */
function projArm(px, py, b){
  const a = armAngle(b), ca = Math.cos(a), sa = Math.sin(a), s = base*CAM.z;
  return [W/2 + CAM.x + (px*ca - py*sa)*s, H/2 + CAM.y + (px*sa + py*ca)*s];
}
const coreXY = () => [W/2 + CAM.x, H/2 + CAM.y];
function nodeRadius(){ return clamp(18*CAM.z, 12, 30); }

/* Предел панорамы — не одна рамка вокруг ядра, а четыре независимые стороны.
   Открытую часть дерева нужно рассматривать свободно: поле едет настолько,
   чтобы любой доступный узел доезжал до центра с запасом. Закрытые ветви
   границу не расширяют — поэтому стена (и полосатая кромка) появляется только
   в той стороне, где начинается туман. Базовый минимум везде один: знак-ядро
   не уходит с экрана. */
const CORE_KEEP = 54, PAN_PAD = 34;
function camBounds(){
  const kx = Math.max(0, W/2 - CORE_KEEP), ky = Math.max(0, H/2 - CORE_KEEP);
  const B = {x1:-kx, x2:kx, y1:-ky, y2:ky};
  const s = base*CAM.z;
  SKILLS.forEach(n => {
    if(nodeState(n.i) === -1) return;                  // туман поле не расширяет
    const a = armAngle(n.b), ca = Math.cos(a), sa = Math.sin(a);
    const dx = (n.wx*ca - n.wy*sa)*s, dy = (n.wx*sa + n.wy*ca)*s;
    B.x1 = Math.min(B.x1, -dx - PAN_PAD); B.x2 = Math.max(B.x2, -dx + PAN_PAD);
    B.y1 = Math.min(B.y1, -dy - PAN_PAD); B.y2 = Math.max(B.y2, -dy + PAN_PAD);
  });
  return B;
}
/* есть ли закрытый узел в той стороне, которую открывает этот оттяг */
function fogAhead(axis, dir){
  const s = base*CAM.z;
  return SKILLS.some(n => {
    if(nodeState(n.i) !== -1) return false;
    const a = armAngle(n.b), ca = Math.cos(a), sa = Math.sin(a);
    const d = axis === 'x' ? (n.wx*ca - n.wy*sa)*s : (n.wx*sa + n.wy*ca)*s;
    return dir > 0 ? d < -CORE_KEEP : d > CORE_KEEP;
  });
}
function rubber(v, lo, hi){
  if(v > hi){ const o = v - hi; return hi + o/(1 + o/70); }   // дальше тянется всё туже
  if(v < lo){ const o = lo - v; return lo - o/(1 + o/70); }
  return v;
}
function camSnap(){
  const B = camBounds();
  CAM.tx = clamp(CAM.tx, B.x1, B.x2); CAM.ty = clamp(CAM.ty, B.y1, B.y2);
  CAM.x = CAM.tx; CAM.y = CAM.ty; CAM.z = CAM.tz;
}
/* экспоненциальное сближение с целью — не зависит от частоты кадров */
function camStep(dt){
  const B = camBounds();
  CAM.tx = clamp(CAM.tx, B.x1, B.x2); CAM.ty = clamp(CAM.ty, B.y1, B.y2);
  const e = 1 - Math.pow(0.0022, dt/1000);
  CAM.z += (CAM.tz - CAM.z)*e;
  if(!dragging){                                       // во время драга ведём руками
    CAM.x += (CAM.tx - CAM.x)*e;
    CAM.y += (CAM.ty - CAM.y)*e;
  }
}

/* --- сеть: клин ×2S вокруг ядра ---------------------------------------
   Развёртка — растущая круглая маска от ядра наружу, импульс готовности —
   светящееся кольцо на том же радиусе. Маска накрывает все слои разом,
   поэтому облако, ветви и импульс идут строго вместе, а переход
   «развёртка → рабочий режим» не даёт скачка.                        */
function drawMandala(t, ph){
  const [cx, cy] = coreXY();
  const unfurl = BOOT.phase === 'unfurl';
  const scale = base*CAM.z*(unfurl ? 0.94 + 0.06*ph.grow : 1);
  const Rpx = NET_MAXR*scale;                    // радиус сети на экране
  const D = MANDALA.groups.length;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(unfurl){
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0, ph.grow*Rpx*1.18), 0, Math.PI*2);
    ctx.clip();
    ctx.globalAlpha = clamp(ph.grow*1.8, 0, 1);
  }

  // 1) облако точек — из кэша, один drawImage
  if(NET){
    const s = scale/NET_REF;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(unfurl) ctx.globalAlpha = clamp(ph.grow*1.8, 0, 1);
    ctx.translate(cx, cy); ctx.rotate(rot0 + rot); ctx.scale(s, s);
    ctx.drawImage(NET.cv, -NET.side/2, -NET.side/2, NET.side, NET.side);
  }

  // 2) ветви — путями: штрих задан в экранных px и делится на масштаб
  for(let d=0; d<D; d++){
    const depthT = d/(D-1);
    const g = MANDALA.groups[d];
    const a = 0.07 + (1-depthT)*0.16;
    const w = ph.wave < 0 ? 0 : clamp(1 - Math.abs(depthT - ph.wave)/0.3, 0, 1);
    ctx.lineWidth = Math.max(0.4, (1.5 - depthT)) / scale;
    for(let k=0;k<MAND_S;k++){
      for(let m=0;m<2;m++){
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.translate(cx, cy);
        ctx.rotate(armAngle(k));
        ctx.scale(scale*(m?-1:1), scale);
        ctx.strokeStyle = `oklch(0.52 0.22 300 / ${a.toFixed(3)})`;
        ctx.fillStyle   = `oklch(0.68 0.20 300 / ${Math.min(1,a*2.1).toFixed(3)})`;
        ctx.stroke(g.seg); ctx.fill(g.dots);
        if(w>0.01){                              // гребень импульса подсвечивает кольцо
          ctx.strokeStyle = `oklch(0.74 0.24 300 / ${(w*0.6).toFixed(3)})`;
          ctx.fillStyle   = `oklch(0.90 0.20 300 / ${(w*0.95).toFixed(3)})`;
          ctx.stroke(g.seg); ctx.fill(g.dots);
        }
      }
    }
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(unfurl){ ctx.globalAlpha = 1; ctx.restore(); }

  // 3) импульс готовности прокатывается от ядра к краю сети
  if(ph.wave >= 0 && ph.wave < 1.35){
    const rr = ph.wave*Rpx;
    const a = (1 - clamp((ph.wave - 0.95)/0.4, 0, 1)) * clamp(ph.wave*4, 0, 1);
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI*2);
    ctx.lineWidth = 12; ctx.strokeStyle = `oklch(0.70 0.24 300 / ${(a*0.10).toFixed(3)})`; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI*2);
    ctx.lineWidth = 2;  ctx.strokeStyle = `oklch(0.88 0.22 300 / ${(a*0.5).toFixed(3)})`;  ctx.stroke();
  }
}

/* --- ядро: контур логотипа --- */
function drawCore(t, ph){
  if(!LOGO_PATH) return;
  const [x, y] = coreXY();
  const breathe = reduceMotion ? 1 : 1 + Math.sin(t*0.0008)*0.02;
  const k = base * CAM.z * 0.34 * ph.core * breathe / LOGO_VB;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-LOGO_VB/2, -LOGO_VB/2);
  ctx.fillStyle = 'rgba(8,8,10,0.82)';
  ctx.fill(LOGO_PATH,'evenodd');
  ctx.fillStyle = 'oklch(0.52 0.22 300 / 0.16)';
  ctx.fill(LOGO_PATH,'evenodd');
  // свечение — широкий полупрозрачный штрих, дешевле shadowBlur
  const flare = BOOT.phase === 'idle' ? 0.30 : 0.16;
  ctx.lineWidth = 10/k; ctx.strokeStyle = `oklch(0.55 0.24 300 / ${flare})`; ctx.stroke(LOGO_PATH);
  ctx.lineWidth = 2.2/k; ctx.strokeStyle = 'oklch(0.64 0.24 300 / 0.95)'; ctx.stroke(LOGO_PATH);
  if(energy > 0.02 && BOOT.phase === 'ready'){
    const ta = Math.min(1, energy*1.3);
    ctx.lineWidth = 7/k;   ctx.strokeStyle = `oklch(0.86 0.21 128 / ${(ta*0.22).toFixed(3)})`; ctx.stroke(LOGO_PATH);
    ctx.lineWidth = 2.2/k; ctx.strokeStyle = `oklch(0.9 0.21 128 / ${ta.toFixed(3)})`;        ctx.stroke(LOGO_PATH);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ломаная звена сети (в координатах клина) → экран */
function strokeArmPoly(pts, b, color, w, glow, part){
  const n = part == null ? pts.length : Math.max(2, Math.ceil(part*pts.length));
  ctx.beginPath();
  const p0 = projArm(pts[0][0], pts[0][1], b);
  ctx.moveTo(p0[0], p0[1]);
  for(let i=1;i<n;i++){ const p = projArm(pts[i][0], pts[i][1], b); ctx.lineTo(p[0], p[1]); }
  if(glow){ ctx.lineWidth = w*4.5; ctx.strokeStyle = glow; ctx.stroke(); }
  ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke();
}

/* --- узлы прокачки поверх своих же вершин сети ---
   Два прохода: сначала закрытая часть (её накроет туман), потом открытая
   поверх тумана — иначе мгла соседней ветви съедала бы доступный узел. */
function drawSkills(t, ph, which){
  if(ph.alpha <= 0.01) return;
  const wantFog = which === 'fog';
  const list = SKILLS.filter(n => (nodeState(n.i) === -1) === wantFog);
  if(!list.length) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = ph.alpha;
  const burnT = burn ? clamp((t - burn.start)/burn.dur, 0, 1) : 0;
  const [cx0, cy0] = coreXY();

  // 1) звенья сети между узлами: подсвечены по состоянию узла
  list.forEach(n => {
    const st = nodeState(n.i);
    const isBurning = burn && burn.i === n.i;
    n.polys.forEach((poly, pi) => {
      if(st === 2 || isBurning){
        const share = isBurning ? clamp(burnT*n.polys.length - pi, 0, 1) : 1;
        strokeArmPoly(poly, n.b, 'oklch(0.52 0.22 300 / 0.5)', 1.8);
        if(share > 0.01)
          strokeArmPoly(poly, n.b, 'oklch(0.88 0.21 128 / 0.95)', 2.6, 'oklch(0.86 0.21 128 / 0.10)', share);
      } else if(st === 1){
        strokeArmPoly(poly, n.b, 'oklch(0.62 0.24 300 / 0.9)', 2, 'oklch(0.55 0.24 300 / 0.12)');
      } else {
        strokeArmPoly(poly, n.b, 'rgba(242,241,236,0.16)', 1.3);
      }
    });
  });

  // 2) частицы вдоль прожжённой ветви — по точкам той же ломаной
  for(let i = wantFog ? -1 : FX.length-1; i>=0; i--){
    const f = FX[i];
    const p = (t - f.start)/f.dur;
    if(p >= 1){ FX.splice(i,1); continue; }
    if(p < 0) continue;
    const pt = projArm(f.x, f.y, f.b);
    ctx.beginPath();
    ctx.fillStyle = `oklch(0.92 0.19 128 / ${(0.9*(1-p)).toFixed(3)})`;
    ctx.arc(pt[0] + f.vx*p*38, pt[1] + f.vy*p*38, (1.4 + (1-p)*2.4), 0, Math.PI*2);
    ctx.fill();
  }

  // 3) сами узлы
  const R = nodeRadius();
  const drawn = [];
  list.forEach(n => {
    const st = nodeState(n.i);
    const [x, y] = projArm(n.wx, n.wy, n.b);
    n.sx = x; n.sy = y;
    if(x < -90 || x > W+90 || y < -110 || y > H+110){ n.la = 0; return; }
    const pulse = (!reduceMotion && st === 1) ? 1 + Math.sin(t*0.004 + n.i)*0.06 : 1;
    const r = R*pulse*(st === 0 ? 0.74 : 1);      // закрытые узлы мельче
    const isBurning = burn && burn.i === n.i;
    const lit = st === 2 || (isBurning && burnT > 0.55);

    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = lit ? 'rgba(20,30,8,0.92)' : (st===1 ? 'rgba(17,13,26,0.92)' : 'rgba(10,10,12,0.9)');
    ctx.fill();

    if(st === 1 && !reduceMotion){                // ореол «зовёт»
      ctx.beginPath(); ctx.arc(x, y, r*(1.5 + Math.sin(t*0.004 + n.i)*0.18), 0, Math.PI*2);
      ctx.strokeStyle = 'oklch(0.55 0.24 300 / 0.22)'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    if(lit){
      ctx.beginPath(); ctx.arc(x, y, r*1.7, 0, Math.PI*2);
      ctx.strokeStyle = 'oklch(0.86 0.21 128 / 0.14)'; ctx.lineWidth = 5; ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.lineWidth = lit ? 2.4 : (st===1 ? 2 : 1.2);
    ctx.strokeStyle = lit ? 'oklch(0.88 0.21 128 / 0.95)'
                    : (st===1 ? 'oklch(0.64 0.24 300 / 0.95)' : 'rgba(242,241,236,0.2)');
    ctx.stroke();

    const k = (r*1.42)/100;                       // сигил внутри узла
    ctx.save();
    ctx.translate(x - r*0.71, y - r*0.71); ctx.scale(k, k);
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = lit ? 'oklch(0.9 0.21 128 / 0.95)'
                    : (st===1 ? 'oklch(0.78 0.16 300 / 0.9)' : 'rgba(242,241,236,0.28)');
    ctx.stroke(sigilP2D(n.i));
    ctx.restore();

    if(hold && hold.i === n.i){                   // прогресс удержания
      const p = clamp((t - hold.start)/hold.dur, 0, 1);
      ctx.beginPath();
      ctx.arc(x, y, r*1.34, -Math.PI/2, -Math.PI/2 + p*Math.PI*2);
      ctx.lineWidth = 3.4;
      ctx.strokeStyle = `oklch(${(0.6+p*0.28).toFixed(2)} 0.22 ${p>0.7?128:300} / 0.95)`;
      ctx.stroke();
    }
    drawn.push({n, x, y, r, st, lit});
  });

  // 4) подписи. Раскладчик проверяет пересечения: что не помещается —
  //    гаснет, что освободилось при зуме — проявляется. Никаких наложений.
  //    У закрытой части подписей нет: за неё говорит одна метка тумана.
  if(!wantFog) layoutLabels(drawn, cx0, cy0);
  ctx.globalAlpha = 1;
}

/* --- туман войны ------------------------------------------------------
   Узлы вне беты не вырезаны из сцены: геометрия, звенья и сигилы на
   месте, но накрыты мглой. Туман собирается из радиальных пятен вокруг
   закрытых узлов — по лучу они сливаются в плюмаж и уходят за кадр,
   поэтому закрытая часть читается как неразведанная территория карты,
   а не как отсутствующая. Дыхание пятен медленное; в статичном режиме
   выключено совсем.
   ---------------------------------------------------------------------- */
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
};
/* пятна: по одному на закрытый узел + два выноса за последний узел луча,
   чтобы туман уходил за кромку сцены, а не заканчивался шариком */
function fogCells(){
  const closed = SKILLS.filter(s => nodeState(s.i) === -1);
  const cells = closed.map(s => ({wx:s.wx, wy:s.wy, b:s.b, k:1}));
  BRANCHES.forEach((_, b) => {
    const mine = closed.filter(s => s.b === b);
    if(!mine.length) return;
    const out = mine.reduce((a, s) => Math.hypot(s.wx, s.wy) > Math.hypot(a.wx, a.wy) ? s : a);
    const r = Math.hypot(out.wx, out.wy) || 1;
    [[1.24, 1.2], [1.52, 1.35], [1.84, 1.5]].forEach(([rr, kk]) =>
      cells.push({wx: out.wx/r*(r*rr), wy: out.wy/r*(r*rr), b, k: kk}));
  });
  return cells;
}
function drawFog(t, ph){
  if(ph.alpha <= 0.01) return;
  const cells = fogCells();
  if(!cells.length) return;
  /* Радиус пятна задаётся в координатах сцены, а не в размере узла: у узла
     размер упирается в потолок (иначе на зуме кружки раздувались бы), и мгла
     вместе с ним перестала бы накрывать разъехавшуюся ветвь. */
  const R = 0.56 * base * CAM.z;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha = ph.alpha;
  cells.forEach((c, k) => {
    const [x, y] = projArm(c.wx, c.wy, c.b);
    const breathe = reduceMotion ? 1 : 1 + Math.sin(t*0.00042 + k*1.7)*0.07;
    const r = R*c.k*breathe;
    if(x < -r || x > W + r || y < -r || y > H + r) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,    'rgba(9,9,12,0.94)');
    g.addColorStop(0.52, 'rgba(12,10,18,0.78)');
    g.addColorStop(1,    'rgba(9,9,12,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}
/* подпись тумана — одна на ветвь, в центре её закрытой части.
   Текст другой, чем у заблокированного узла: «вне беты» ≠ «не хватает узлов». */
function drawFogLabels(ph){
  if(ph.alpha <= 0.3) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha = ph.alpha;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  BRANCHES.forEach((br, b) => {
    const mine = SKILLS.filter(s => s.b === b && nodeState(s.i) === -1);
    if(!mine.length) return;
    let sx = 0, sy = 0;
    mine.forEach(s => { const p = projArm(s.wx, s.wy, s.b); sx += p[0]; sy += p[1]; });
    sx /= mine.length; sy /= mine.length;
    if(sx < 40 || sx > W - 40 || sy < 30 || sy > H - 30) return;
    const f1 = clamp(11*CAM.z, 10, 14), f2 = clamp(9*CAM.z, 8.5, 11);
    ctx.font = `500 ${f1}px 'JetBrains Mono',monospace`;
    ctx.fillStyle = 'rgba(242,241,236,0.62)';
    ctx.fillText('ВНЕ БЕТЫ', sx, sy - f1*0.7);
    ctx.font = `400 ${f2}px 'JetBrains Mono',monospace`;
    ctx.fillStyle = 'rgba(139,139,147,0.7)';
    ctx.fillText(mine.length + ' ' + plural(mine.length, 'узел', 'узла', 'узлов'), sx, sy + f2*0.9);
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}

/* --- полосатая кромка на overscroll ----------------------------------
   Поле кончилось: из-за кромки, от которой тянут, проступает сигнальная
   штриховка — тем плотнее, чем глубже оттяг, и гаснет вместе с резиновым
   возвратом. Если за этой кромкой туман, полосы красные и подписаны
   «вне беты»; если просто край поля — нейтральные.
   ---------------------------------------------------------------------- */
let STRIPE = null;
function stripePattern(){
  if(STRIPE) return STRIPE;
  const S = 14, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,46,77,0.16)';
  g.fillRect(0,0,S,S);
  g.strokeStyle = 'rgba(255,46,77,0.85)';
  g.lineWidth = 5; g.lineCap = 'square';
  // диагональ 45°, продублированная по обе стороны тайла — шов не виден
  [-S, 0, S].forEach(o => { g.beginPath(); g.moveTo(o - 2, S + 2); g.lineTo(o + S + 2, -2); g.stroke(); });
  STRIPE = ctx.createPattern(c, 'repeat');
  return STRIPE;
}
const OVER_MAX = 132;                       // глубже кромку не рисуем
function drawOverscroll(){
  const B = camBounds();
  const ox = CAM.x - clamp(CAM.x, B.x1, B.x2);
  const oy = CAM.y - clamp(CAM.y, B.y1, B.y2);
  if(Math.abs(ox) < 0.6 && Math.abs(oy) < 0.6) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  /* Полосы — это метка «здесь закрыто», поэтому они появляются только в
     стороне тумана. Обычный конец поля отмечается одной тихой нитью: туда
     просто дальше нечего смотреть, а не запрещено. */
  const band = (x, y, w, h, depth, fog, edgeAt) => {
    const a = clamp(depth/86, 0, 1);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if(fog){
      ctx.globalAlpha = a*0.9;
      ctx.fillStyle = stripePattern();
      ctx.fillRect(x, y, w, h);
    }
    ctx.globalAlpha = fog ? a : a*0.5;
    ctx.fillStyle = fog ? 'rgba(255,46,77,0.9)' : 'rgba(242,241,236,0.34)';
    if(w < h) ctx.fillRect(edgeAt === 'l' ? x : x + w - 1.5, y, 1.5, h);
    else      ctx.fillRect(x, edgeAt === 't' ? y : y + h - 1.5, w, 1.5);
    ctx.restore();
    ctx.globalAlpha = 1;
  };

  if(Math.abs(ox) > 0.6){
    const d = Math.min(Math.abs(ox), OVER_MAX);
    const left = ox > 0;                      // тянут вправо → упёрлись в левую кромку
    band(left ? 0 : W - d, 0, d, H, Math.abs(ox), fogAhead('x', ox), left ? 'l' : 'r');
  }
  if(Math.abs(oy) > 0.6){
    const d = Math.min(Math.abs(oy), OVER_MAX);
    const top = oy > 0;
    band(0, top ? 0 : H - d, W, d, Math.abs(oy), fogAhead('y', oy), top ? 't' : 'b');
  }
}

/* --- раскладка подписей без наложений ---------------------------------
   Занятые прямоугольники копятся в OCC: сначала все кружки узлов, потом
   подписи в порядке важности. Кандидат, который не влез, плавно гаснет,
   а не исчезает рывком — за это отвечает n.la / BR_LA.            */
const BR_LA = new Map();
let cvLeft = 0, cvTop = 0;
/* HTML-оверлеи поверх сцены (подсказка, кнопки, «Билеты») — такие же занятые
   прямоугольники: подпись не имеет права уехать под них */
const UI_OVER = ['#hint span', '#recenterBtn', '#infoBtn', '#ticketFab'];
function layoutLabels(drawn, cx0, cy0){
  const OCC = [];
  const free = (b) => !OCC.some(o => !(b[2] < o[0] || b[0] > o[2] || b[3] < o[1] || b[1] > o[3]));
  const add  = (b) => OCC.push(b);
  UI_OVER.forEach(sel => {
    const el = $(sel);
    if(!el || el.offsetParent === null) return;
    const r = el.getBoundingClientRect();
    if(!r.width) return;
    add([r.left - cvLeft - 8, r.top - cvTop - 8, r.right - cvLeft + 8, r.bottom - cvTop + 8]);
  });
  drawn.forEach(d => add([d.x - d.r - 2, d.y - d.r - 2, d.x + d.r + 2, d.y + d.r + 2]));

  const fs = clamp(10.5*CAM.z, 9, 13);
  /* пытаемся поставить подпись в четыре стороны от узла: по касательной
     в обе стороны, наружу по радиусу и внутрь */
  function place(x, y, r, lines, sizes){
    let ux = x - cx0, uy = y - cy0;
    const L = Math.hypot(ux, uy) || 1; ux /= L; uy /= L;
    const dirs = [[-uy, ux], [uy, -ux], [ux, uy], [-ux, -uy]];
    let w = 0;
    lines.forEach((s, i) => { ctx.font = `500 ${sizes[i]}px 'JetBrains Mono',monospace`;
                              w = Math.max(w, ctx.measureText(s).width); });
    const h = lines.reduce((a, _, i) => a + sizes[i] + (i ? 3 : 0), 0);
    for(const [dx, dy] of dirs){
      const ax = x + dx*(r + 9), ay = y + dy*(r + 9);
      const align = dx > 0.3 ? 'left' : (dx < -0.3 ? 'right' : 'center');
      const base  = dy > 0.3 ? 'top'  : (dy < -0.3 ? 'bottom' : 'middle');
      const x1 = align === 'left' ? ax : (align === 'right' ? ax - w : ax - w/2);
      const y1 = base  === 'top'  ? ay : (base  === 'bottom' ? ay - h : ay - h/2);
      const box = [x1 - 4, y1 - 3, x1 + w + 4, y1 + h + 3];
      if(box[0] < 4 || box[2] > W - 4 || box[1] < 4 || box[3] > H - 4) continue;
      if(!free(box)) continue;
      add(box);
      return {x: x1, y: y1, w, h};              // рисуем от левого верхнего угла
    }
    return null;
  }
  function paint(pos, lines, sizes, colors, alpha){
    if(alpha <= 0.01 || !pos) return;
    const g = ctx.globalAlpha;
    ctx.globalAlpha = g*alpha;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    let yy = pos.y;
    lines.forEach((s, i) => {
      ctx.font = `500 ${sizes[i]}px 'JetBrains Mono',monospace`;
      ctx.fillStyle = colors[i];
      ctx.fillText(s, pos.x, yy);
      yy += sizes[i] + 3;
    });
    ctx.globalAlpha = g;
  }
  const fade = (cur, want) => cur + (want - cur)*0.16;

  // Три прохода по важности: живые узлы → заголовки ветвей → закрытые.
  // Кто пришёл раньше, тот занял место; остальные гаснут.
  function labelNode(d){
    const n = d.n;
    const lines = d.st === 0 ? [TIERS[n.i].n + ' узл.']
                : d.lit      ? [TIERS[n.i].skill]
                             : [TIERS[n.i].skill, 'удерживай'];
    const sizes  = d.st === 0 ? [fs] : (d.lit ? [fs] : [fs, fs - 1.5]);
    const colors = d.st === 0 ? ['rgba(139,139,147,0.75)']
                 : d.lit      ? ['rgba(182,255,60,0.95)']
                              : ['rgba(242,241,236,0.94)', 'rgba(123,47,247,0.98)'];
    // закрытые узлы подписываются только когда сцена достаточно крупная
    const allowed = d.st !== 0 || CAM.z > 0.92;
    const pos = allowed ? place(d.x, d.y, d.r, lines, sizes) : null;
    n.la = fade(n.la || 0, pos ? 1 : 0);
    paint(pos, lines, sizes, colors, n.la);
  }
  drawn.filter(d => d.st === 1).forEach(labelNode);
  drawn.filter(d => d.st === 2).forEach(labelNode);

  // заголовки ветвей — за последним узлом по радиусу
  BRANCHES.forEach((br, b) => {
    const outer = SKILLS.filter(s => s.b === b).reduce((a, s) =>
      Math.hypot(s.wx, s.wy) > Math.hypot(a.wx, a.wy) ? s : a);
    const rr = Math.hypot(outer.wx, outer.wy), aa = Math.atan2(outer.wy, outer.wx);
    const p = projArm(Math.cos(aa)*(rr + 0.42), Math.sin(aa)*(rr + 0.42), b);
    // заголовок ветви не должен уезжать за кадр вместе с концом луча
    p[0] = clamp(p[0], 46, W - 46); p[1] = clamp(p[1], 34, H - 34);
    // счётчик ветви считает только то, что участвует в бете: «0/3» у
    // полностью закрытой ветви читалось бы как невыполненная задача
    const openIdx = br.idx.filter(inBeta);
    const done = openIdx.filter(i => hasClaim(i)).length;
    const s1 = clamp(15*CAM.z, 13, 19), s2 = clamp(10*CAM.z, 9, 12);
    const lines = openIdx.length ? [`${done}/${openIdx.length}`, `${br.rom} · ${br.name}`]
                                 : [`${br.rom} · ${br.name}`];
    const sizes = openIdx.length ? [s1, s2] : [s2];
    const col = !openIdx.length ? ['rgba(139,139,147,0.45)']
              : done            ? ['rgba(182,255,60,0.95)', 'rgba(182,255,60,0.75)']
                                : ['rgba(139,139,147,0.6)', 'rgba(139,139,147,0.62)'];
    const pos = place(p[0], p[1], 2, lines, sizes);
    const cur = fade(BR_LA.get(b) || 0, pos ? 1 : 0);
    BR_LA.set(b, cur);
    paint(pos, lines, sizes, col, cur);
  });

  // закрытые узлы — последними: они уступают место всем остальным
  drawn.filter(d => d.st === 0).forEach(labelNode);
}

function draw(t){
  const ph = bootPhase(t);
  // поворот = накопленный дрейф + доворот развёртки. Дрейф копится в loop(),
  // поэтому пауза на удержании и конец развёртки не дают скачка угла.
  rot = rotDrift + ph.spin;
  if(BOOT.phase === 'unfurl' && ph.p >= 1) finishBoot();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(shake > 0.01){
    const s = shake*6;
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }
  if(BOOT.phase !== 'idle') drawMandala(t, ph);
  drawCore(t, ph);
  drawSkills(t, ph, 'fog');             // закрытая часть — под мглой
  drawFog(t, ph);
  drawSkills(t, ph, 'open');            // открытая часть — поверх мглы
  drawFogLabels(ph);
  if(BOOT.phase === 'ready') drawOverscroll();
  ctx.setTransform(1,0,0,1,0,0);
}

function loop(t){
  const dt = clamp(t - (lastT || t), 0, 64); lastT = t;
  energy += (energyTarget - energy)*(1 - Math.pow(0.02, dt/1000));
  if(shake > 0) shake = Math.max(0, shake - dt*0.0028);
  if(burn && t - burn.start > burn.dur) burn = null;
  // дрейф сети копится, а не считается от t0 — остановка на удержании
  // и любые паузы не сдвигают угол рывком
  if(BOOT.phase === 'ready' && !hold) rotDrift += dt*0.000012;
  camStep(dt);
  draw(t);
  raf = requestAnimationFrame(loop);
}
function startLoop(){
  if(running) return;
  running = true;
  lastT = 0;
  if(reduceMotion){ camSnap(); draw(performance.now()); running = false; return; }
  raf = requestAnimationFrame(loop);
}
function stopLoop(){ running = false; cancelAnimationFrame(raf); }
/* в статичном режиме кадр рисуется по запросу — анимации нет, но состояние обновляется */
const kick = () => { if(reduceMotion || !running){ if(reduceMotion) camSnap(); draw(performance.now()); } };
/* ============================================================
   9. ЖЕСТЫ: пан-зум канвы, тап по узлу, удержание для активации
   Скроллится и зумится только сцена — страница неподвижна.
   ============================================================ */
const HOLD_MS = 1000;
const pointers = new Map();
let dragging = false, moved = 0, pinch0 = 0, pinchZ = 1;
let rawX = 0, rawY = 0;                      // положение драга без ограничения
const edgeHit = {x:0, y:0};                  // упор в кромку отзывается один раз на сторону

function hitNode(x, y){
  const R = nodeRadius()*1.6 + 8;
  let best = null, bd = R;
  SKILLS.forEach(n => {
    if(n.sx == null) return;
    const d = Math.hypot(n.sx - x, n.sy - y);
    if(d < bd){ bd = d; best = n; }
  });
  return best;
}
function centerOn(n, z){
  CAM.tz = clamp(z || Math.max(CAM.tz, 1.15), CAM.min, CAM.max);
  const a = armAngle(n.b), s = base*CAM.tz;
  const B = camBounds();
  CAM.tx = clamp(-(n.wx*Math.cos(a) - n.wy*Math.sin(a))*s, B.x1, B.x2);
  CAM.ty = clamp(-(n.wx*Math.sin(a) + n.wy*Math.cos(a))*s, B.y1, B.y2);
  kick();                                     // сам перелёт доезжает в loop()
}
function recenter(){ CAM.tx = 0; CAM.ty = 0; CAM.tz = 1; kick(); }

/* ============================================================
   9-A. РИТУАЛ ЗАПУСКА
   Сначала на пустом экране только фиолетовый знак. Касание —
   развёртка сети кольцо за кольцом, затем импульс готовности
   прокатывается от ядра наружу, и интерфейс проявляется.
   ============================================================ */
function finishBoot(){
  if(BOOT.phase === 'ready') return;
  BOOT.phase = 'ready';
  document.body.classList.add('live');
  syncEnergy();
  kick();
}
function startUnfurl(){
  if(BOOT.phase !== 'idle') return;
  BOOT.phase = 'unfurl';
  BOOT.t0 = performance.now();
  $('#bootBtn').classList.add('gone');
  TG.haptic('impact','medium');
  if(reduceMotion){ finishBoot(); return; }       // статичный режим: без развёртки
  startLoop();
  setTimeout(() => TG.haptic('notify','success'), BOOT.dur*0.62);
  setTimeout(finishBoot, BOOT.dur);
}
$('#bootBtn').addEventListener('click', startUnfurl);

/* --- удержание: единственный путь к активации скилла --- */
let holdTimer = 0, holdPulse = 0;
function startHold(i, source){
  if(nodeState(i) !== 1) return false;             // заблокированный/полученный не реагирует
  cancelHold();
  hold = {i, start: performance.now(), dur: HOLD_MS, source};
  TG.haptic('impact','light');
  kick();
  // нарастающая пульсация: чем ближе к концу, тем чаще и жёстче
  const tickHaptic = () => {
    if(!hold) return;
    const p = clamp((performance.now() - hold.start)/hold.dur, 0, 1);
    if(p >= 1) return;
    TG.haptic('impact', p > 0.75 ? 'medium' : 'light');
    holdPulse = setTimeout(tickHaptic, 200 - p*120);
  };
  holdPulse = setTimeout(tickHaptic, 180);
  holdTimer = setTimeout(() => { const h = hold; hold = null; if(h) claimSkill(h.i); }, HOLD_MS);
  if(source === 'sheet') renderHoldProgress();
  return true;
}
function cancelHold(){
  clearTimeout(holdTimer); clearTimeout(holdPulse);
  if(hold){ hold = null; kick(); }
  const b = $('#holdBtn'); if(b) b.style.setProperty('--p', 0);
}
/* видимый прогресс на кнопке в окне узла — работает и без хаптики */
function renderHoldProgress(){
  const b = $('#holdBtn');
  if(!b || !hold) return;
  const p = clamp((performance.now() - hold.start)/hold.dur, 0, 1);
  b.style.setProperty('--p', p.toFixed(3));
  if(p < 1 && hold) requestAnimationFrame(renderHoldProgress);
}

/* --- pointer events на канве --- */
cv.addEventListener('pointerdown', e => {
  if(BOOT.phase !== 'ready') return;              // до развёртки сцена не реагирует
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY, t:performance.now()});
  moved = 0;
  if(pointers.size === 2){
    cancelHold();
    const [a,b] = [...pointers.values()];
    pinch0 = Math.hypot(a.x-b.x, a.y-b.y) || 1;
    pinchZ = CAM.z;
    dragging = false;
    return;
  }
  rawX = CAM.x; rawY = CAM.y;
  edgeHit.x = edgeHit.y = 0;
  const r = cv.getBoundingClientRect();
  const n = hitNode(e.clientX - r.left, e.clientY - r.top);
  const st = n ? nodeState(n.i) : null;
  if(st === 1) startHold(n.i, 'canvas');
  else if(st === -1) TG.haptic('impact','rigid');     // туман на удержание не отвечает
  else if(n) TG.haptic('select');
  dragging = true;
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if(!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.hypot(dx, dy);
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
    CAM.z = CAM.tz = clamp(pinchZ * (d/pinch0), CAM.min, CAM.max);  // пинч ведём напрямую
    kick();
    return;
  }
  if(moved > 12) cancelHold();               // уводишь палец — активация отменяется
  if(dragging){
    // за пределом поле упирается: смещение гасится, отпустишь — вернёт.
    // Отклик жёстче и с полосатой кромкой только там, где дальше туман.
    const B = camBounds();
    rawX += dx; rawY += dy;
    CAM.x = CAM.tx = rubber(rawX, B.x1, B.x2);
    CAM.y = CAM.ty = rubber(rawY, B.y1, B.y2);
    const hx = rawX > B.x2 ? 1 : (rawX < B.x1 ? -1 : 0);
    const hy = rawY > B.y2 ? 1 : (rawY < B.y1 ? -1 : 0);
    if((hx && hx !== edgeHit.x) || (hy && hy !== edgeHit.y))
      TG.haptic('impact', (hx && fogAhead('x', hx)) || (hy && fogAhead('y', hy)) ? 'rigid' : 'soft');
    edgeHit.x = hx; edgeHit.y = hy;
    kick();
  }
});
function endPointer(e){
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch0 = 0;
  if(!p) return;
  const quick = performance.now() - p.t < 320 && moved < 12;
  cancelHold();
  dragging = pointers.size > 0;
  if(!dragging){                              // возврат из overscroll
    const B = camBounds();
    rawX = CAM.tx = clamp(CAM.x, B.x1, B.x2);
    rawY = CAM.ty = clamp(CAM.y, B.y1, B.y2);
    startLoop(); kick();
  }
  if(quick){
    const r = cv.getBoundingClientRect();
    const n = hitNode(e.clientX - r.left, e.clientY - r.top);
    if(n) openNode(n.i);
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); cancelHold(); dragging = false; });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if(BOOT.phase !== 'ready') return;
  CAM.tz = clamp(CAM.tz * (e.deltaY < 0 ? 1.14 : 0.88), CAM.min, CAM.max);
  startLoop(); kick();                        // масштаб доезжает плавно
}, {passive:false});

/* ============================================================
   10. АКТИВАЦИЯ СКИЛЛА — победная анимация и запись состояния
   Открытие окна (§ openNode) — скромное появление; активация —
   ударная: прожиг ветви от ядра, частицы, смена цвета, хаптика.
   ============================================================ */
function playClaimFX(i, preview){
  const n = nodeByTier(i);
  if(!n) return;
  if(reduceMotion){                             // статичный режим: без частиц и тряски
    burn = {i, start: performance.now() - 900, dur: 900, preview:!!preview};
    kick();
    return;
  }
  burn = {i, start: performance.now(), dur: 900, preview:!!preview};
  shake = 1;
  // частицы летят по точкам тех же звеньев сети, что и прожиг ветви
  const pts = n.polys.flat().concat([[n.wx, n.wy]]);
  for(let k=0;k<38;k++){
    const p = pts[k % pts.length];
    const a = Math.random()*Math.PI*2;
    FX.push({x:p[0], y:p[1], b:n.b, vx:Math.cos(a), vy:Math.sin(a),
             start: performance.now() + Math.random()*260, dur: 520 + Math.random()*380});
  }
  startLoop();
}
function claimSkill(i){
  if(nodeState(i) !== 1) return;
  const u = myUser();
  if(!u){ toast('Сначала активируй узел', true); return; }
  const list = claims();
  if(list.indexOf(i) >= 0) return;              // один claim на скилл — повтор невозможен
  list.push(i); list.sort((a,b)=>a-b);
  saveClaims();
  logEvent('claimed', TIERS[i].skill);
  TG.haptic('notify','success');
  playClaimFX(i, false);
  toast('Забрано: ' + TIERS[i].skill);
  syncEnergy();
  renderBar(); renderHint(); renderFabPrice();
  if(openNodeIdx === i) renderNodeSheet(i);     // окно, если открыто, переходит в «получен»
}
function syncEnergy(){
  const c = refCount(myUser());
  energyTarget = clamp(0.05 + (claimedCount()/TIERS.length)*0.75 + Math.min(0.2, c/100*0.2), 0, 1);
  if(reduceMotion){ energy = energyTarget; kick(); }
}

/* ============================================================
   11. ОКНО УЗЛА
   Тап — просмотр (скромная анимация), активация — только удержанием.
   ============================================================ */
let openNodeIdx = -1;
function nodeSheetHTML(i, preview){
  const t = TIERS[i], st = preview ? 1 : nodeState(i);
  const b = BRANCHES[branchOf(i)];
  const c = refCount(myUser());
  const pct = clamp((c / t.n) * 100, 0, 100);
  const chip = st===2  ? '<span class="chip chip--done">получен</span>'
             : st===1  ? '<span class="chip chip--ready">доступен</span>'
             : st===-1 ? '<span class="chip chip--fog">вне беты</span>'
             : '<span class="chip">нужно больше узлов</span>';
  const sig = `<span class="nsheet__sigil ${st===2?'done':(st===1?'ready':'lock')}">${
    sigilSVG('SKILL_' + t.skill, st===2 ? 'var(--accent-toxic)' : (st===1 ? 'var(--ink)' : 'var(--ink-muted)'))}</span>`;

  let action = '';
  if(st === 1){
    action = `<button class="hold" id="holdBtn" aria-label="Удерживай, чтобы активировать скилл">
        <i aria-hidden="true"></i><span>Держи, чтобы забрать</span></button>
      <p class="hold-note">Отпустишь раньше — ничего не изменится.</p>`;
  } else if(st === 2){
    action = `<p class="hold-note" style="color:var(--accent-toxic);margin-top:var(--s3)">
        Забрано. Узел ${esc(me() || '')}. Отмены нет.</p>`;
  } else if(st === -1){
    // «вне беты» — это не «мало рефералов»: другой текст, другой вывод
    const open = betaOpenList().map(k => TIERS[k].skill).join(' · ');
    action = `<div class="fognote">
        <b>Не участвует в бете.</b>
        <ul><li>В тесте открыто: ${esc(open)}</li>
            <li>Всё это — про билеты и вход</li>
            <li>Мерч и пожизненные бонусы включим после теста</li></ul>
      </div>`;
  } else {
    const need = Math.max(0, t.n - c);
    action = `<p class="hold-note" style="margin-top:var(--s3)">
        Ещё <b style="color:var(--accent-primary)">${need}</b> ${plural(need,'узел','узла','узлов')}.
        Узел засчитывается, когда приглашённый оплатил билет.</p>
      <button class="btn btn--ghost btn--wide" id="nsShare" style="margin-top:12px">Позвать своих →</button>`;
  }

  return `
    <div class="sheet__grab" aria-hidden="true"></div>
    <button class="sheet__close" data-close aria-label="Закрыть">✕</button>
    <div class="nsheet__top">
      ${sig}
      <div>
        <div class="mono muted">Ветвь ${esc(b.rom)} · ${esc(b.name)} · узел ${String(i+1).padStart(2,'0')}</div>
        <h3 id="nsName" style="margin:6px 0 8px">${esc(t.skill)}</h3>
        ${chip}${preview ? ' <span class="chip">preview</span>' : ''}
      </div>
    </div>
    <div class="nsheet__reward">
      <div class="k">Что даёт</div>
      <div class="v">${esc(t.line)}</div>
      <div class="k" style="margin-top:12px">Полностью</div>
      <div class="v" style="font-size:13px;color:var(--ink-muted)">${esc(t.label)}</div>
    </div>
    ${st === -1 ? '' : `
    <div class="prog">
      <div class="prog__row mono"><span>Приглашено</span><span>${Math.min(c, t.n)} / ${t.n}</span></div>
      <div class="prog__bar"><i style="width:${pct}%"></i></div>
    </div>`}
    ${action}`;
}
function renderNodeSheet(i, preview){
  $('#nodeSheet').innerHTML = nodeSheetHTML(i, preview);
  const hb = $('#holdBtn');
  if(hb){
    // тот же жест, что и на канве: удержание с видимым прогрессом
    hb.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { hb.setPointerCapture(e.pointerId); } catch(err){}
      startHold(i, 'sheet');
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => hb.addEventListener(ev, cancelHold));
  }
  const sh = $('#nsShare');
  if(sh) sh.onclick = () => { const u = myUser(); u ? shareRef(u.code) : activateNode(); };
  syncMainButton();
}
function openNode(i, preview){
  openNodeIdx = i;
  renderNodeSheet(i, preview);
  openHost('#nodeHost');
  TG.haptic('select');
  if(!preview) logEvent('opened', TIERS[i].skill);
  const n = nodeByTier(i);
  if(n && !preview) centerOn(n);
}
/* ============================================================
   12. НАВИГАЦИЯ: стек модалок под системной BackButton
   BackButton закрывает верхний слой, а не выходит из приложения.
   ============================================================ */
const stack = [];
function openHost(sel){
  const h = $(sel);
  if(!h || stack[stack.length-1] === sel) return;
  h.hidden = false;
  h.dataset.opened = String(Math.round(performance.now()));
  requestAnimationFrame(() => h.classList.add('in'));
  stack.push(sel);
  TG.back(true, popHost);
  syncMainButton();
}
function closeHost(sel){
  const h = $(sel); if(!h) return;
  h.classList.remove('in');
  setTimeout(() => {
    if(h.classList.contains('in')) return;                 // успели открыть заново — не гасим
    h.hidden = true;
    if(sel === '#coHost') $('#coSheet').innerHTML = '';     // стираем введённые данные карты из DOM
  }, reduceMotion ? 0 : 300);
  const k = stack.lastIndexOf(sel);
  if(k >= 0) stack.splice(k, 1);
  if(sel === '#nodeHost') openNodeIdx = -1;
  if(!stack.length) TG.back(false);
  syncMainButton();
}
function popHost(){
  if(stack.length) closeHost(stack[stack.length-1]);
  else if(S.tab !== 'tree') setTab('tree');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if(!c) return;
  /* Лист открывается по pointerup, а на тач-экранах следом прилетает
     синтетический click — уже в скрим, который к этому моменту накрыл
     сцену. Короткая отсечка после открытия: иначе на части WebView тап
     по узлу открывал бы окно и сам же его закрывал. */
  const host = c.closest('.host');
  if(host && performance.now() - (+host.dataset.opened || 0) < 400) return;
  popHost();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ cancelHold(); popHost(); }
});

/* MainButton зависит от контекста: активация скилла / оплата / скрыта на дереве */
function syncMainButton(){
  const top = stack[stack.length-1];
  if(top === '#coHost' && $('#payForm')){ return; }        // текст ставит сам чекаут
  if(top === '#nodeHost' && openNodeIdx >= 0 && nodeState(openNodeIdx) === 1){
    TG.mainShow('Активировать скилл', () => {
      // MainButton — это намерение; обязательство подтверждается удержанием
      const b = $('#holdBtn');
      if(b){ b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
      TG.haptic('impact','medium');
      toast('Удерживай знак, чтобы прожечь ветвь');
    }, '#7B2FF7');
    return;
  }
  if(!top){ TG.mainHide(); return; }
  TG.mainHide();
}

/* ---------- 13. вкладки ---------- */
const S = {tab:'tree'};
function setTab(name){
  S.tab = name;
  $$('#tabs button').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $('#crewPanel').hidden = name !== 'crew';
  $('#ticketFab').style.display = name === 'tree' ? '' : 'none';
  $('#recenterBtn').style.display = name === 'tree' ? '' : 'none';
  $('#infoBtn').style.display = name === 'tree' ? '' : 'none';
  $('#hint').style.display = name === 'tree' ? '' : 'none';
  if(name === 'tree'){ startLoop(); kick(); } else { stopLoop(); renderCrew(); }
  TG.haptic('select');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if(b) setTab(b.dataset.tab);
});

/* ---------- 14. верхний бар и подсказка ---------- */
function renderBar(){
  const u = myUser(), c = refCount(u);
  const code = u ? u.code : null;
  $('#barSigil').innerHTML = sigilSVG(code || 'RIZZOMA', code ? 'var(--accent-toxic)' : 'var(--ink-muted)');
  $('#barSigil').classList.toggle('lit', !!code);
  $('#barCode').textContent = code || 'НЕТ УЗЛА';
  $('#barState').textContent = code ? (u.paid ? 'билет оплачен' : 'узел активен') : 'нажми, чтобы создать';
  $('#barTier').textContent = tierName(c);
  $('#barCount').textContent = c;
}
function renderHint(){
  const u = myUser();
  const el = $('#hint');
  if(!u){ el.innerHTML = '<span>Узла нет · нажми на знак слева вверху</span>'; return; }
  const c = refCount(u), ready = readyCount();
  if(ready){
    el.innerHTML = `<span><b class="ready">${ready}</b> ${plural(ready,'узел готов','узла готовы','узлов готовы')} · держи знак</span>`;
    return;
  }
  // цель ищем только среди открытых в бете узлов: вести к туману нельзя
  const nextI = ECON.nextOpenTier(c, claims(), betaOpenList());
  if(nextI < 0){ el.innerHTML = '<span>В бете забрано всё</span>'; return; }
  const need = TIERS[nextI].n - c;
  el.innerHTML = `<span>Ещё <b>${need}</b> ${plural(need,'узел','узла','узлов')} → ${esc(TIERS[nextI].skill)}</span>`;
}
function renderFabPrice(){
  const c = refCount(myUser());
  const p = comboPrice('std', 'solo', c, priceOpts());
  $('#fabPrice').textContent = p === 0 ? '· бесплатно' : (c >= 1 ? '· −20%' : '');
}

/* ---------- 15. узел, ссылка, шаринг ---------- */
function refLink(code){
  if(CFG.bot && CFG.app) return `https://t.me/${CFG.bot}/${CFG.app}?startapp=${code}`;
  if(CFG.bot)            return `https://t.me/${CFG.bot}?startapp=${code}`;
  const u = new URL(location.href);
  u.search = '?ref=' + code; u.hash = '';

/* ============================================================
   16. МОК-ЧЕКАУТ — та же механика, другой контейнер
   Валидация уровня настоящего шлюза; данные карты не покидают
   вкладку: ничего не отправляется, не логируется, не пишется.
   ============================================================ */
const TEST_CARDS = {'4242424242424242':'ok', '4000000000000002':'declined'};

function luhn(num){
  const s = num.replace(/\D/g,'');
  if(s.length<12) return false;
  let sum=0, dbl=false;
  for(let i=s.length-1;i>=0;i--){
    let d = +s[i];
    if(dbl){ d*=2; if(d>9) d-=9; }
    sum += d; dbl = !dbl;
  }
  return sum%10===0;
}
function detectBrand(num){
  const s = num.replace(/\D/g,'');
  if(/^4/.test(s)) return {k:'visa', label:'VISA'};
  if(/^(5[1-5]|222[1-9]|22[3-9]\d|2[3-6]\d\d|27[01]\d|2720)/.test(s)) return {k:'mc', label:'MASTERCARD'};
  if(/^220[0-4]/.test(s)) return {k:'mir', label:'МИР'};
  return null;
}
const V = {
  card(v){
    const d = v.replace(/\D/g,'');
    if(!d) return 'Введи номер карты';
    if(d.length<16) return 'Номер неполный — 16 цифр';
    if(!detectBrand(d)) return 'Платёжная система не распознана';
    if(!luhn(d)) return 'Номер не проходит проверку (алгоритм Луна)';
    return '';
  },
  exp(v){
    const m = v.match(/^(\d{2})\s*\/\s*(\d{2})$/);
    if(!m) return 'Формат ММ/ГГ';
    const mm = +m[1], yy = 2000 + +m[2];
    if(mm<1 || mm>12) return 'Месяц 01–12';
    const now = new Date();
    if(new Date(yy, mm, 1) <= new Date(now.getFullYear(), now.getMonth(), 1)) return 'Срок действия истёк';
    if(yy > now.getFullYear()+20) return 'Слишком далёкая дата';
    return '';
  },
  cvv(v){ return /^\d{3}$/.test(v) ? '' : 'Три цифры'; },
  name(v){
    const s = v.trim();
    if(!s) return 'Имя держателя обязательно';
    if(!/^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё\s-]{1,40}$/.test(s)) return 'Только буквы, пробел и дефис';
    return '';
  },
  email(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? '' : 'Формат: name@domain.ru'; }
};

/* ---------- расчёт покупки и зачисление реферала ---------- */
function settlePurchase({email, name}){
  // Вне Telegram уникальный покупатель — e-mail; внутри Mini App — аккаунт Telegram.
  const buyerId = TG.user ? ('tg:' + TG.user.id) : email;
  const existing = DB.buyers[buyerId];
  let code = me();

  if(existing){                                              // повторная покупка — узел не начисляем
    if(!code) setMe(existing);
    ensureUser(existing, {paid:true});
    saveDB();
    return {code: existing, duplicate:true, credited:null};
  }

  if(!code){ code = newCode(); ensureUser(code, {}); }
  const user = ensureUser(code, {paid:true, email:buyerId, name});
  DB.buyers[buyerId] = code;
  DB.profiles[buyerId] = {
    name: (TG.user ? [TG.user.first_name, TG.user.last_name].filter(Boolean).join(' ') : '') || name,
    username: (TG.user && TG.user.username) || '',
    photo: (TG.user && TG.user.photo_url) || '',
    ts: Date.now()
  };
  setMe(code);

  let credited = null;
  const attr = readAttr();
  if(attr && attr.code && attr.code !== code){
    const ref = ensureUser(attr.code, {});
    if(!ref.referrals.includes(buyerId)){                     // один раз на покупателя
      ref.referrals.push(buyerId);
      credited = attr.code;
    }
    if(!user.referredBy) user.referredBy = attr.code;
  }
  saveDB();
  /* Серверу об оплате не сообщаем: в живом режиме узел начисляет вебхук
     successful_payment, а не клиент. Этот путь — только локальная
     имитация для браузера и автотестов. */
  return {code, duplicate:false, credited, buyerId};
}

function pseudoQR(seed){
  const N = 25, rnd = mulberry32(hashStr(seed));
  const c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,N,N);
  x.fillStyle='#000';
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(rnd()>0.52) x.fillRect(i,j,1,1);
  [[0,0],[N-7,0],[0,N-7]].forEach(([ox,oy]) => {
    x.fillStyle='#fff'; x.fillRect(ox,oy,7,7);
    x.fillStyle='#000'; x.fillRect(ox,oy,7,1); x.fillRect(ox,oy+6,7,1);
    x.fillRect(ox,oy,1,7); x.fillRect(ox+6,oy,1,7); x.fillRect(ox+2,oy+2,3,3);
  });
  return c;
}

/* ---------- доступ ----------
   Вне Telegram панель — локальный QA-инструмент: она правит только
   localStorage этой вкладки, поэтому открыта (иначе браузерная приёмка
   и автотесты невозможны).
   Внутри Telegram — allowlist: id не из CFG.admins не открывает панель ни
   по ?admin=1, ни пятью тапами по знаку. Живые данные беты (тестеры,
   платежи, туман для всех) приходят только после подтверждения бэкендом:

   ADMIN_TG_IDS поверх проверенной initData. */
function clientAdmin(){
  if(!CFG.panel) return false;                               // сборка для тестера: панели нет вовсе
  if(!TG.on) return true;                                    // браузерный QA — локальный
  return (CFG.admins || []).map(String).indexOf(String(TG.user && TG.user.id)) >= 0;
}

async function betaApi(path, body){
  if(!API || !TG.on) return null;
  try {
    const r = await fetch(API + path, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({initData: WA.initData}, body || {}))
    });
    if(r.status === 401 || r.status === 403){ betaAdmin = false; return {denied:true}; }
    if(!r.ok) return null;
    return await r.json();
  } catch(e){ return null; }
}
async function betaSync(){

  }
