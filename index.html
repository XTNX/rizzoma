<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RIZZOMA — дерево узлов</title>
<meta name="description" content="RIZZOMA — билеты и реферальная сеть. Позвал друга, он оплатил — тебе узел. Узлы открывают скидки, бесплатный вход и VIP.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta property="og:title" content="RIZZOMA // дерево узлов">
<meta property="og:description" content="Билеты и реферальная сеть. 18+">
<meta property="og:image" content="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@200;300;400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#08080A">
<!-- Telegram Mini App SDK. Вне Telegram скрипт безвреден: WebApp.platform === 'unknown',
     приложение работает в браузере как обычная страница-приложение. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Конфигурация деплоя (бот, short name приложения, бэкенд, цены). Правится без пересборки. -->
<script src="config.js"></script>
<!-- Экономика: пороги узлов, тарифы, расчёт цены. Тот же файл считает цену в юнит-тестах. -->
<script src="economy.js"></script>
<!-- Баллы за активность в канале. Тот же файл начисляет их на бэкенде. -->
<script src="engagement.js"></script>
<style>
/* ============================================================
   RIZZOMA — Mini App «дерево узлов»
   Токены наследуются из brand-spec.md без изменений: палитра,
   шрифты, radius=0, кривая и длительности motion.
   Меняется композиция (одно приложение-экран вместо лендинга),
   а не визуальный словарь.
   ============================================================ */
:root{
  --bg:#08080A;
  --bg-raised:#111114;
  --bg-sunken:#050506;
  --ink:#F2F1EC;
  --ink-muted:#8B8B93;
  --accent-primary:#7B2FF7;
  --accent-secondary:#FF2E4D;
  --accent-toxic:#B6FF3C;
  --line:rgba(242,241,236,0.08);
  --line-strong:rgba(242,241,236,0.18);

  --f-display:'Space Grotesk',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --f-body:'Sora',sans-serif;

  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px;
  --pad:clamp(14px,4vw,28px);

  --ease:cubic-bezier(0.83,0,0.17,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --t-fast:200ms; --t-mid:520ms; --t-slow:900ms;
  --radius:0px;

  /* Telegram: safe-area и стабильная высота вьюпорта.
     В браузере подставляется env(safe-area-inset-*). */
  --tg-top:env(safe-area-inset-top,0px);
  --tg-bottom:env(safe-area-inset-bottom,0px);
  --tg-vh:100svh;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-weight:300;font-size:15px;line-height:1.55;
  text-wrap:pretty;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
img,svg,canvas{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
::selection{background:var(--accent-primary);color:#fff}
:focus-visible{outline:2px solid var(--accent-toxic);outline-offset:2px}
.mono{font-family:var(--f-mono);font-weight:400;letter-spacing:0.08em;text-transform:uppercase;font-size:11px}
.muted{color:var(--ink-muted)}
.mark{fill:currentColor;flex:none}

/* ============================ КАРКАС ПРИЛОЖЕНИЯ ============================ */
.app{
  position:fixed;inset:0;height:var(--tg-vh);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-top:var(--tg-top);
}

/* ---------- верхний бар ---------- */
.bar{
  display:flex;align-items:center;gap:10px;
  padding:10px var(--pad);border-bottom:1px solid var(--line);
  background:rgba(8,8,10,0.86);backdrop-filter:blur(12px);z-index:6;
}
.bar__id{display:flex;align-items:center;gap:9px;min-width:0}
.bar__sigil{width:34px;height:34px;flex:none;border:1px solid var(--line-strong);
  display:grid;place-items:center;background:var(--bg-sunken);position:relative}
.bar__sigil svg{width:88%;height:88%}
.bar__sigil.lit{border-color:rgba(182,255,60,.5)}
.bar__code{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.bar__code b{font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.1em;color:var(--accent-toxic)}
.bar__code span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-muted);text-transform:uppercase}
.bar__stat{margin-left:auto;display:flex;align-items:center;gap:var(--s2);text-align:right}
.bar__stat div{display:flex;flex-direction:column;line-height:1.15}
.bar__stat b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.bar__stat span{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--ink-muted);text-transform:uppercase}
/* демо-кнопка QA в баре: намеренно выглядит «служебной», чтобы её не забыли убрать */
.bar__qa{flex:none;height:38px;padding:0 10px;border:1px dashed var(--accent-secondary);
  color:var(--accent-secondary);font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  display:grid;place-items:center}
.bar__qa[hidden]{display:none}
.bar__share{flex:none;width:38px;height:38px;border:1px solid var(--line-strong);display:grid;place-items:center;
  transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.bar__share:hover,.bar__share:active{border-color:var(--accent-toxic);color:var(--accent-toxic)}
.bar__share svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}

/* ---------- сцена дерева ---------- */
.stage{position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
#tree{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage__veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 90% at 50% 45%,rgba(8,8,10,0) 45%,rgba(8,8,10,.55) 85%,rgba(8,8,10,.9) 100%)}
.stage__hint{position:absolute;left:var(--pad);right:calc(var(--pad) + 48px);top:10px;pointer-events:none;
  display:flex;justify-content:center}
.stage__hint span{border:1px solid var(--line);background:rgba(8,8,10,.72);backdrop-filter:blur(8px);
  padding:6px 11px;color:var(--ink-muted);max-width:100%;text-align:center}
.stage__hint b{color:var(--accent-primary);font-weight:500}
.stage__hint b.ready{color:var(--accent-toxic)}

.icon-btn{position:absolute;width:38px;height:38px;border:1px solid var(--line-strong);
  background:rgba(8,8,10,.7);backdrop-filter:blur(8px);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:13px;color:var(--ink-muted);z-index:3;
  transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.icon-btn:hover,.icon-btn:active{border-color:var(--ink);color:var(--ink)}
#recenterBtn{right:var(--pad);top:10px}
#infoBtn{right:var(--pad);top:56px}

/* плавающая кнопка билетов — покупка всегда в один тап */
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:4;
  display:inline-flex;align-items:center;gap:10px;
  background:var(--accent-toxic);color:#08080A;
  font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  padding:14px 22px;border:1px solid var(--accent-toxic);
  transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.fab:active{transform:translateX(-50%) translateY(1px)}
.fab i{font-style:normal;font-family:var(--f-mono);font-size:10px;opacity:.72}

/* ---------- ритуал запуска ---------- */
/* интерфейс не существует, пока сеть не развёрнута: на экране только знак */
.bar,.tabs,.fab,.icon-btn,.stage__hint{
  opacity:0;pointer-events:none;
  transition:opacity 620ms var(--ease-out) 120ms,transform 620ms var(--ease-out) 120ms}
.bar{transform:translateY(-8px)}
.tabs{transform:translateY(8px)}
.fab{transform:translateX(-50%) translateY(10px)}
body.live .bar,body.live .tabs,body.live .fab,body.live .icon-btn,body.live .stage__hint{opacity:1;pointer-events:auto}
body.live .bar,body.live .tabs,body.live .icon-btn{transform:none}
body.live .fab{transform:translateX(-50%)}
body.live .stage__hint{pointer-events:none}
.boot{position:absolute;inset:0;z-index:7;display:grid;place-items:center;
  transition:opacity var(--t-mid) var(--ease)}
.boot.gone{opacity:0;pointer-events:none}
.boot__hint{position:absolute;left:0;right:0;top:calc(50% + clamp(84px,17vw,132px));
  text-align:center;color:var(--ink-muted);opacity:0;
  animation:bootHint 3.2s var(--ease-out) 1.1s infinite}
@keyframes bootHint{0%,100%{opacity:.35}50%{opacity:.9}}
html.reduce .boot__hint{opacity:.7;animation:none}

/* ---------- нижние вкладки ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);
  background:rgba(8,8,10,.92);backdrop-filter:blur(12px);
  padding-bottom:var(--tg-bottom);z-index:6}
.tabs button{padding:13px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-muted);position:relative;
  transition:color var(--t-fast) var(--ease)}
.tabs button::after{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:transparent;
  transition:background var(--t-fast) var(--ease)}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{background:var(--accent-toxic)}
.tabs .dot{display:inline-block;width:5px;height:5px;background:var(--accent-primary);margin-left:6px;
  vertical-align:middle}

/* ---------- вкладка «Свои» ---------- */
.panel{position:absolute;inset:0;z-index:5;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:var(--s3) var(--pad) calc(var(--s5) + 20px)}
.panel[hidden]{display:none}
.panel h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:-0.03em;
  font-size:clamp(28px,8vw,40px);line-height:.95;margin:0 0 10px}
.panel__lead{color:var(--ink-muted);font-size:14px;margin:0 0 var(--s3);max-width:62ch}

/* ============================ ОБЩИЕ БЛОКИ ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:15px 22px;border:1px solid var(--ink);background:var(--ink);color:#08080A;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),
             border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn--ghost{background:none;color:var(--ink);border-color:var(--line-strong)}
.btn--ghost:hover,.btn--ghost:active{border-color:var(--ink)}
.btn--toxic{background:var(--accent-toxic);border-color:var(--accent-toxic);color:#08080A}
.btn--flat{background:none;border:none;padding:8px 0;color:var(--ink);border-bottom:1px solid var(--line-strong)}
.btn--flat:hover,.btn--flat:active{color:var(--accent-toxic);border-bottom-color:var(--accent-toxic)}
.btn--wide{width:100%}

.field{display:flex;gap:8px;margin-top:10px}
.field input{flex:1;min-width:0;background:var(--bg-sunken);border:1px solid var(--line-strong);
  padding:13px 12px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em}
.field input:read-only{color:var(--accent-toxic)}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(24px);
  bottom:calc(152px + var(--tg-bottom));z-index:400;
  background:var(--accent-toxic);color:#08080A;font-family:var(--f-mono);font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;padding:11px 16px;max-width:86vw;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity var(--t-mid) var(--ease),transform var(--t-mid) var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.warn{background:var(--accent-secondary);color:#fff}

/* ============================ SHEETS ============================ */
.host{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.host[hidden]{display:none}
.host__scrim{position:absolute;inset:0;background:rgba(4,4,6,.78);backdrop-filter:blur(5px);
  opacity:0;transition:opacity var(--t-mid) var(--ease)}
.host.in .host__scrim{opacity:1}
.sheet{position:relative;width:min(560px,100%);max-height:min(88svh,calc(var(--tg-vh) - 40px));
  overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg-raised);border:1px solid var(--line-strong);border-bottom:none;
  padding:var(--s3) var(--pad) calc(var(--s3) + var(--tg-bottom));
  transform:translateY(101%);transition:transform var(--t-mid) var(--ease)}
.host.in .sheet{transform:none}
.sheet--tall{min-height:min(70svh,520px)}
.sheet__grab{width:44px;height:3px;background:var(--line-strong);margin:0 auto var(--s3)}
.sheet__close{position:absolute;top:12px;right:12px;width:32px;height:32px;border:1px solid var(--line-strong);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--ink-muted)}
.sheet__close:hover{border-color:var(--accent-secondary);color:var(--accent-secondary)}
.sheet h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:-0.03em;
  font-size:clamp(26px,7vw,34px);line-height:.95;margin:0}

/* ---------- окно узла ---------- */
.nsheet__top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);align-items:center}
.nsheet__sigil{width:70px;height:70px;border:1px solid var(--line-strong);background:var(--bg-sunken);
  display:grid;place-items:center;position:relative}
.nsheet__sigil svg{width:82%;height:82%}
.nsheet__sigil.lock{opacity:.45}
.nsheet__sigil.done{border-color:var(--accent-toxic);box-shadow:0 0 22px rgba(182,255,60,.22)}
.nsheet__sigil.ready{border-color:var(--accent-primary);box-shadow:0 0 22px rgba(123,47,247,.28)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line-strong);padding:4px 8px;color:var(--ink-muted)}
.chip--ready{color:var(--accent-primary);border-color:rgba(123,47,247,.55)}
.chip--done{color:var(--accent-toxic);border-color:rgba(182,255,60,.5)}
.chip--fog{color:var(--accent-secondary);border-color:rgba(255,46,77,.45)}
/* «вне беты»: другой блок, чем у заблокированного узла — чтобы не путали
   границу теста с нехваткой приглашённых */
.fognote{margin-top:var(--s3);border:1px dashed rgba(255,46,77,.45);padding:var(--s2);background:rgba(255,46,77,.04)}
.fognote b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-secondary);font-weight:500}
.fognote ul{margin:10px 0 0;padding-left:18px;color:var(--ink-muted);font-size:13px;line-height:1.65}
.nsheet__reward{margin:var(--s3) 0 0;padding:var(--s2);border:1px solid var(--line);background:var(--bg-sunken)}
.nsheet__reward .k{color:var(--ink-muted);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.nsheet__reward .v{margin-top:6px;font-size:15px}
.prog{margin-top:var(--s3)}
.prog__row{display:flex;justify-content:space-between;gap:var(--s2);color:var(--ink-muted)}
.prog__bar{height:2px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}
.prog__bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent-primary),var(--accent-toxic));
  transition:width var(--t-slow) var(--ease)}

/* удержание — единственный путь к активации скилла */
.hold{position:relative;width:100%;margin-top:var(--s3);padding:18px 20px;
  border:1px solid var(--accent-primary);background:rgba(123,47,247,.08);
  font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);
  background:linear-gradient(90deg,rgba(123,47,247,.55),rgba(182,255,60,.55));z-index:0}
.hold span{position:relative;z-index:1}
.hold.pulse{animation:holdPulse 620ms var(--ease) 2}
@keyframes holdPulse{0%,100%{box-shadow:0 0 0 0 rgba(123,47,247,0)}50%{box-shadow:0 0 0 6px rgba(123,47,247,.22)}}
.hold-note{margin:10px 0 0;color:var(--ink-muted);font-size:12px;text-align:center}

/* ---------- чекаут ---------- */
/* состав × класс: два сегмент-контрола вместо списка тарифов */
.seglab{margin:var(--s3) 0 6px}
.seg{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.seg--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{background:var(--bg-sunken);padding:12px 8px;text-align:center;
  transition:background var(--t-fast) var(--ease)}
.seg button[aria-pressed="true"]{background:#17121f;box-shadow:inset 0 2px 0 var(--accent-primary)}
.seg b{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;
  font-size:14px;letter-spacing:-0.01em}
.seg span{display:block;margin-top:3px;font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-muted)}
.seg button[aria-pressed="true"] span{color:var(--accent-primary)}
.colist{margin:var(--s2) 0 0;padding-left:18px;color:var(--ink-muted);font-size:13px;line-height:1.7}
.livebanner{border:1px solid rgba(182,255,60,.4);color:var(--accent-toxic);padding:11px 12px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  line-height:1.6;margin-top:var(--s2)}
.order{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);
  border-top:1px solid var(--line);padding-top:var(--s2);margin-top:var(--s2)}
.order .sum{font-family:var(--f-mono);font-weight:500;font-size:clamp(18px,5.6vw,26px);white-space:nowrap}
.tk{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:var(--s2)}
.tk button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center;
  background:var(--bg-sunken);padding:14px var(--s2);text-align:left;
  transition:background var(--t-fast) var(--ease)}
.tk button[aria-pressed="true"]{background:#17121f;box-shadow:inset 2px 0 0 var(--accent-primary)}
.tk .n{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:19px;letter-spacing:-0.02em}
.tk .s{display:block;color:var(--ink-muted);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.tk .p{font-family:var(--f-mono);font-weight:500;font-size:17px;text-align:right;white-space:nowrap}
.tk .p s{display:block;color:var(--ink-muted);font-size:11px;font-weight:400}
.testbanner{border:1px solid var(--accent-secondary);color:var(--accent-secondary);padding:11px 12px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;line-height:1.6;margin-top:var(--s2)}
/* вопрос — тире — короткий ответ: форма памяток из канала */
.faq{list-style:none;margin:var(--s2) 0 0;padding:0;display:grid;gap:1px;background:var(--line);
  border:1px solid var(--line)}
.faq li{background:var(--bg-sunken);padding:11px var(--s2)}
.faq b{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-muted);font-weight:400}
.faq span{display:block;margin-top:5px;font-size:13.5px;line-height:1.55}
.attrline{color:var(--ink-muted);font-size:11px;font-family:var(--f-mono);letter-spacing:.05em;margin:10px 0 0}
.attrline b{color:var(--accent-primary)}
.disc{color:var(--accent-toxic);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;margin-top:10px}
.form{display:grid;gap:12px;margin-top:var(--s3)}
.grp{display:flex;flex-direction:column;gap:5px}
.grp>label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.inp{position:relative;display:flex;align-items:center}
.inp input{width:100%;background:var(--bg-sunken);border:1px solid var(--line-strong);padding:13px 12px;
  font-family:var(--f-mono);font-size:14px;letter-spacing:.06em;transition:border-color var(--t-fast) var(--ease)}
.inp input::placeholder{color:#4a4a52}
.inp input:focus{border-color:var(--accent-primary)}
.grp.bad .inp input{border-color:var(--accent-secondary)}
.grp.ok .inp input{border-color:rgba(182,255,60,.4)}
.brand{position:absolute;right:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--ink-muted);border:1px solid var(--line-strong);padding:3px 6px;pointer-events:none}
.brand[data-b="visa"]{color:#fff;border-color:#fff}
.brand[data-b="mc"]{color:#FF8A00;border-color:#FF8A00}
.brand[data-b="mir"]{color:var(--accent-toxic);border-color:var(--accent-toxic)}
.err{color:var(--accent-secondary);font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;
  min-height:13px;text-transform:uppercase}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.testcards{margin-top:var(--s2);border:1px dashed var(--line-strong);padding:12px}
.testcards .t{color:var(--ink-muted);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:8px}
.testcards button{display:flex;justify-content:space-between;gap:var(--s2);width:100%;
  border:1px solid var(--line);padding:8px 10px;margin-bottom:6px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-align:left}
.testcards button:hover{border-color:var(--ink)}
.testcards .ok{color:var(--accent-toxic)}
.testcards .no{color:var(--accent-secondary)}
.spin{width:12px;height:12px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;
  display:inline-block;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pass{border:1px solid var(--accent-toxic);padding:var(--s2);margin-top:var(--s2);
  background:linear-gradient(180deg,rgba(182,255,60,.05),transparent);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:start}
.pass dl{margin:10px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em}
.pass dt{color:var(--ink-muted);text-transform:uppercase}
.pass dd{margin:0}
.qr{width:104px;height:104px;background:#fff;padding:7px}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}
.qr__cap{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;color:var(--ink-muted);text-align:center;margin-top:5px}
.decline{border:1px solid var(--accent-secondary);padding:var(--s2);color:var(--accent-secondary);margin-top:var(--s2)}
.decline p{color:var(--ink-muted);margin:6px 0 0;font-size:13px}

/* ---------- «свои» ---------- */
.src{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;border:1px dashed var(--line-strong);padding:5px 9px;color:var(--ink-muted)}
.src b{color:var(--accent-secondary);font-weight:500}
.src--live{border-style:solid;border-color:rgba(182,255,60,.4)}
.src--live b{color:var(--accent-toxic)}
.crew__sub{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);
  margin:var(--s4) 0 var(--s1);border-top:1px solid var(--line);padding-top:var(--s2)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.mate{background:var(--bg-raised);padding:12px var(--s2);display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.mate--invite{background:var(--bg)}
.mate.fresh{animation:fresh 1200ms var(--ease)}
@keyframes fresh{0%{background:rgba(182,255,60,.16)}100%{background:transparent}}
.ava{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;
  font-family:var(--f-mono);font-size:13px;font-weight:500;color:#08080A;background:var(--accent-primary)}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.mate--invite .ava{background:var(--bg-sunken);color:var(--ink-muted);border:1px solid var(--line-strong)}
.mate__n{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:-0.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mate__h{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.mate__s{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line-strong);padding:4px 6px;color:var(--ink-muted);white-space:nowrap}
.mate__s--paid{color:var(--accent-toxic);border-color:rgba(182,255,60,.45)}
.mate__s--mine{color:var(--accent-primary);border-color:rgba(123,47,247,.5)}
.mate__s--demo{border-style:dashed}
.mate__btn{border:1px solid var(--line-strong);padding:8px 10px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.mate__btn:hover{border-color:var(--accent-toxic);color:var(--accent-toxic)}
/* активность в канале: сумма баллов и последние начисления */
.eng{border:1px solid var(--line);background:var(--bg-raised);padding:var(--s2)}
.eng__sum{display:flex;align-items:baseline;gap:8px}
.eng__sum b{font-family:var(--f-mono);font-weight:500;font-size:30px;color:var(--accent-toxic);line-height:1}
.eng__list{list-style:none;margin:var(--s2) 0 0;padding:0;display:grid;gap:1px;background:var(--line)}
.eng__list li{background:var(--bg-raised);display:flex;justify-content:space-between;gap:var(--s2);
  padding:7px 0;font-size:13px;color:var(--ink-muted)}
.eng__list b{font-family:var(--f-mono);font-weight:500;color:var(--accent-toxic)}
.eng__none{margin:10px 0 0;color:var(--ink-muted);font-size:13px}
.gate{border:1px solid var(--line-strong);background:var(--bg-raised);padding:var(--s2);
  display:grid;gap:10px;margin-top:var(--s3)}
.gate h4{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:-0.02em;
  font-size:20px;margin:0}
.gate p{margin:0;color:var(--ink-muted);font-size:13px}
.empty{color:var(--ink-muted);font-size:13px;padding:var(--s2) 0;border-top:1px solid var(--line)}

/* ---------- админка ---------- */
.adm{display:grid;gap:var(--s3)}
.adm__warn{border:1px solid var(--accent-secondary);color:var(--accent-secondary);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 11px;line-height:1.5}
.adm section{border-top:1px solid var(--line);padding-top:var(--s2)}
.adm h4{margin:0 0 10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-muted)}
.adm__row{display:flex;flex-wrap:wrap;gap:6px}
.adm__row .btn{padding:10px 12px;font-size:10.5px;letter-spacing:.08em}
.adm__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.adm input,.adm textarea{width:100%;background:var(--bg-sunken);border:1px solid var(--line-strong);
  padding:9px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}
.adm textarea{min-height:150px;line-height:1.5;letter-spacing:0;text-transform:none;resize:vertical}
.adm__skill{border:1px solid var(--line);padding:9px;display:grid;gap:6px}
.adm__skill .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.adm__skill .h b{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:-0.01em}
.adm__skill .h span{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--ink-muted)}
.adm__skill .r{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.adm__skill button{border:1px solid var(--line-strong);padding:7px 2px;
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.adm__skill button:hover{border-color:var(--accent-toxic);color:var(--accent-toxic)}
/* туман: переключатели «в бете / закрыто» */
.adm__fog{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.fogsw{border:1px solid var(--line-strong);padding:8px 6px;text-align:left;background:var(--bg-sunken)}
.fogsw b{display:block;font-family:var(--f-display);font-size:11.5px;text-transform:uppercase;
  letter-spacing:-0.01em;color:var(--ink-muted)}
.fogsw span{display:block;margin-top:3px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent-secondary)}
.fogsw[aria-pressed="true"]{border-color:rgba(182,255,60,.45)}
.fogsw[aria-pressed="true"] b{color:var(--ink)}
.fogsw[aria-pressed="true"] span{color:var(--accent-toxic)}
/* воронка тестеров */
.adm__t{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;
  border:1px solid var(--line);padding:8px 9px;margin-top:5px}
.adm__t--head{grid-template-columns:minmax(0,1fr) auto;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-muted);border-style:dashed}
.adm__t b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:-0.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm__t span{display:block;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-muted)}
.adm__t .mono{font-size:9.5px;color:var(--ink-muted);white-space:nowrap}
.adm__t button{border:1px solid var(--line-strong);padding:6px 8px;font-family:var(--f-mono);
  font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.adm__t button:hover{border-color:var(--accent-secondary);color:var(--accent-secondary)}
.adm__t.off{opacity:.5}
.adm__log{font-family:var(--f-mono);font-size:10px;color:var(--ink-muted);line-height:1.7;
  max-height:170px;overflow:auto;border:1px solid var(--line);padding:9px}
.adm__log b{color:var(--accent-toxic);font-weight:400}
.adm__log i{color:var(--accent-primary);font-style:normal}
.sw{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  border:1px solid var(--line);padding:10px 11px;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase}
.sw i{width:34px;height:18px;border:1px solid var(--line-strong);position:relative;flex:none}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink-muted);
  transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.sw[aria-pressed="true"] i{border-color:var(--accent-toxic)}
.sw[aria-pressed="true"] i::after{transform:translateX(16px);background:var(--accent-toxic)}

/* ============================ REDUCED MOTION ============================ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
html.reduce *,html.reduce *::before,html.reduce *::after{
  animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
/* прогресс удержания — функциональный индикатор, он нужен и в статичном режиме */
html.reduce .hold i{transition:none!important}

/* внутри Telegram системные элементы дублировать не нужно */
html.tg .sheet__close{display:none}
html.tg.no-back .sheet__close{display:grid}
</style>

<div class="app">

  <header class="bar">
    <button class="bar__id" id="idBtn" aria-label="Твой узел">
      <span class="bar__sigil" id="barSigil"></span>
      <span class="bar__code"><b id="barCode">—</b><span id="barState">узла нет</span></span>
